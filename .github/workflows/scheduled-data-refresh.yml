name: Scheduled raw data refresh

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate required secret
        run: |
          if [[ -z "${{ secrets.TAVILY_API_KEY }}" ]]; then
            echo "TAVILY_API_KEY is not set. Configure it in Repository Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

      - name: Refresh raw-source snapshots
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SKIP_OPENCLI: "1"
          RAW_HISTORY_KEEP: "180"
        run: ./refresh-outbreak-raw-data.sh

      - name: Recompute dashboard dataset
        run: node scripts/recompute-dashboard-data.js

      - name: Validate published outbreak dataset
        run: node validate-outbreak-data.js

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw-sources/manifest.json raw-sources/latest raw-sources/history outbreak-data.js
          git commit -m "chore(data): refresh raw-source snapshots and recompute dashboard"

          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push failed (attempt ${attempt}), rebasing from origin/main..."
            git pull --rebase origin main
          done

          echo "Push failed after retries." >&2
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp outbreak-data.js _site/outbreak-data.js
          if [ -f ebola-data.js ]; then
            cp ebola-data.js _site/ebola-data.js
          fi
          if [ -f hantavirus-outbreak-tracker-v2.html ]; then
            cp hantavirus-outbreak-tracker-v2.html _site/hantavirus-outbreak-tracker-v2.html
          fi
          if [ -f ebola-tracker.html ]; then
            cp ebola-tracker.html _site/ebola-tracker.html
          fi
          if [ -d geo ]; then
            mkdir -p _site/geo
            cp geo/* _site/geo/
          fi
          mkdir -p _site/raw-sources/latest
          cp raw-sources/manifest.json _site/raw-sources/manifest.json
          cp raw-sources/latest/*.json _site/raw-sources/latest/ || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
