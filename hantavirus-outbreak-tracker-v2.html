<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>汉坦病毒（安第斯病毒）全球确诊追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap");

  :root {
    --bg: #f4efe3;
    --bg-accent-1: rgba(25, 200, 185, 0.14);
    --bg-accent-2: rgba(224, 90, 90, 0.12);
    --bg-accent-3: rgba(245, 195, 28, 0.11);
    --surface: #fffdf6;
    --surface-alt: #f5efe1;
    --line: #d7cdb9;
    --text: #6a4f33;
    --muted: #8f7f66;
    --primary: #19c8b9;
    --primary-strong: #0f8f86;
    --danger: #e05a5a;
    --warning: #f5c31c;
    --ok: #6fba2c;
    --glow: 0 0 0 3px rgba(25, 200, 185, 0.18);
    --shadow-sm: 0 3px 10px rgba(61, 52, 40, 0.08);
    --shadow: 0 10px 28px rgba(61, 52, 40, 0.11);
    --radius-sm: 14px;
    --radius-md: 18px;
    --radius-lg: 24px;
    --panel-pad: 14px;
  }

  body[data-theme="night"] {
    --bg: #121923;
    --bg-accent-1: rgba(55, 212, 194, 0.16);
    --bg-accent-2: rgba(255, 120, 109, 0.14);
    --bg-accent-3: rgba(255, 209, 102, 0.13);
    --surface: #1f2936;
    --surface-alt: #243142;
    --line: #3a4a5d;
    --text: #f1ead9;
    --muted: #b8ae9a;
    --primary: #4bdccc;
    --primary-strong: #22b9aa;
    --danger: #ff8782;
    --warning: #ffd166;
    --ok: #97d96a;
    --glow: 0 0 0 3px rgba(75, 220, 204, 0.24);
    --shadow-sm: 0 4px 12px rgba(0, 0, 0, 0.24);
    --shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% 10%, var(--bg-accent-1), transparent 34%),
      radial-gradient(circle at 88% 4%, var(--bg-accent-2), transparent 30%),
      radial-gradient(circle at 52% 100%, var(--bg-accent-3), transparent 42%),
      linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0) 40%),
      var(--bg);
    color: var(--text);
    font-family: Nunito, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    transition: background 0.26s ease, color 0.26s ease;
  }

  .page {
    max-width: 1660px;
    margin: 0 auto;
    padding: 18px 16px 32px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 14px 16px;
    border: 2px solid color-mix(in srgb, var(--line) 82%, transparent);
    border-radius: var(--radius-lg);
    background: color-mix(in srgb, var(--surface) 90%, #fff 10%);
    box-shadow: var(--shadow-sm);
  }

  .title-wrap h1 {
    margin: 0;
    font-size: clamp(1.3rem, 2.5vw, 2.05rem);
    letter-spacing: 0.2px;
    color: color-mix(in srgb, var(--text) 88%, #3f3120 12%);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.34);
  }

  .title-wrap p {
    margin: 5px 0 0;
    font-size: 0.93rem;
    color: var(--muted);
  }

  .top-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .segmented {
    display: inline-flex;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    background: color-mix(in srgb, var(--surface) 92%, #fff 8%);
    box-shadow: var(--shadow-sm);
  }

  .segmented button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 0.84rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .segmented button.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.1);
  }

  .mode-btn {
    border: 2px solid var(--line);
    background: color-mix(in srgb, var(--surface) 94%, #fff 6%);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 0.83rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }

  .mode-btn:hover {
    border-color: color-mix(in srgb, var(--primary) 50%, var(--line) 50%);
    color: var(--primary-strong);
    transform: translateY(-1px);
  }

  .meta-bar {
    display: grid;
    grid-template-columns: repeat(2, minmax(260px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }

  .meta-card {
    background: var(--surface);
    border: 2px solid color-mix(in srgb, var(--line) 84%, transparent);
    border-radius: var(--radius-md);
    border-left: 6px solid color-mix(in srgb, var(--primary) 64%, var(--warning) 36%);
    padding: 10px 12px;
    color: var(--muted);
    font-size: 0.85rem;
    box-shadow: var(--shadow-sm);
  }

  .map-daily-row {
    display: grid;
    grid-template-columns: minmax(220px, 20%) minmax(0, 80%);
    gap: 12px;
    padding: 12px;
    align-items: stretch;
  }

  .daily-panel {
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--danger) 14%, transparent) 0%, color-mix(in srgb, var(--warning) 14%, transparent) 26%, var(--surface-alt) 26%, var(--surface) 100%);
    color: var(--text);
    border-radius: var(--radius-md);
    border: 2px solid color-mix(in srgb, var(--danger) 26%, var(--line) 74%);
    padding: var(--panel-pad);
    box-shadow: var(--shadow);
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }

  body[data-theme="night"] .daily-panel {
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--danger) 20%, transparent) 0%, color-mix(in srgb, var(--warning) 20%, transparent) 26%, var(--surface-alt) 26%, var(--surface) 100%);
    border-color: color-mix(in srgb, var(--danger) 34%, var(--line) 66%);
  }

  .daily-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px dashed color-mix(in srgb, var(--line) 72%, transparent);
  }

  .map-shell {
    border: 2px solid color-mix(in srgb, var(--line) 75%, transparent);
    border-radius: var(--radius-md);
    padding: 5px;
    background:
      radial-gradient(circle at 8% 8%, color-mix(in srgb, var(--primary) 12%, transparent), transparent 38%),
      color-mix(in srgb, var(--surface) 92%, #ffffff 8%);
    min-height: 560px;
  }

  body[data-theme="night"] .map-shell {
    background:
      radial-gradient(circle at 8% 8%, color-mix(in srgb, var(--primary) 16%, transparent), transparent 42%),
      color-mix(in srgb, var(--surface) 92%, #22375f 8%);
  }

  .daily-title {
    font-size: 0.96rem;
    font-weight: 800;
    margin: 0;
    color: color-mix(in srgb, var(--text) 84%, var(--danger) 16%);
  }

  .daily-chip {
    font-size: 0.7rem;
    font-weight: 800;
    letter-spacing: 0.15px;
    color: color-mix(in srgb, var(--danger) 76%, #fff 24%);
    background: color-mix(in srgb, var(--danger) 16%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  .daily-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: 7px;
  }

  .daily-cell {
    background: color-mix(in srgb, var(--surface) 92%, #fff 8%);
    border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
    border-top: 3px solid color-mix(in srgb, var(--danger) 42%, transparent);
    border-radius: 12px;
    padding: 8px 8px 7px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }

  .daily-label {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .daily-value {
    font-size: 1.02rem;
    font-weight: 800;
    margin-top: 2px;
    color: color-mix(in srgb, var(--text) 84%, var(--danger) 16%);
  }

  .daily-health {
    margin-top: 10px;
    border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
    border-radius: 12px;
    background: color-mix(in srgb, var(--surface) 94%, #fff 6%);
    padding: 10px 10px 9px;
    overflow: auto;
    flex: 1;
    min-height: 0;
  }

  .daily-health-title {
    font-size: 0.79rem;
    font-weight: 800;
    color: color-mix(in srgb, var(--text) 78%, var(--danger) 22%);
    margin-bottom: 7px;
  }

  .daily-health-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 6px;
  }

  .daily-health-item {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 7px;
    align-items: start;
    font-size: 0.74rem;
    line-height: 1.36;
    color: color-mix(in srgb, var(--text) 82%, var(--muted) 18%);
  }

  .daily-health-item .k {
    color: color-mix(in srgb, var(--danger) 72%, var(--text) 28%);
    font-weight: 800;
    white-space: nowrap;
  }

  .daily-health-item .v {
    word-break: break-word;
  }

  .daily-health-source {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed color-mix(in srgb, var(--line) 78%, transparent);
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.32;
  }

  .daily-health-source a {
    color: var(--primary);
    text-decoration: none;
  }

  .daily-health-source a:hover {
    text-decoration: underline;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(7, minmax(120px, 1fr));
    gap: 12px;
    margin-bottom: 12px;
  }

  .stat {
    background: var(--surface);
    border: 2px solid color-mix(in srgb, var(--line) 82%, transparent);
    border-radius: var(--radius-md);
    padding: 11px 12px 10px;
    box-shadow: var(--shadow-sm);
    position: relative;
    overflow: hidden;
  }

  .stat::before {
    content: "";
    position: absolute;
    inset: 0 auto auto 0;
    width: 100%;
    height: 5px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--primary) 76%, var(--warning) 24%), transparent);
  }

  .stat .label {
    font-size: 0.74rem;
    color: var(--muted);
    margin-bottom: 6px;
    font-weight: 700;
  }

  .stat .value {
    font-size: clamp(1.18rem, 2vw, 1.62rem);
    font-weight: 800;
    line-height: 1;
  }

  .stat.primary .value { color: var(--primary); }
  .stat.ok .value { color: var(--ok); }
  .stat.warning .value { color: var(--warning); }
  .stat.danger .value { color: var(--danger); }

  .card {
    background: var(--surface);
    border: 2px solid color-mix(in srgb, var(--line) 84%, transparent);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .card + .card {
    margin-top: 10px;
  }

  .card-header {
    padding: 12px 14px;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 84%, transparent);
    background: linear-gradient(180deg, color-mix(in srgb, var(--surface-alt) 88%, #fff 12%) 0%, color-mix(in srgb, var(--surface) 94%, #fff 6%) 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
  }

  body[data-theme="night"] .card-header {
    background: linear-gradient(180deg, color-mix(in srgb, var(--surface-alt) 92%, #1a2230 8%) 0%, color-mix(in srgb, var(--surface) 94%, #1a2230 6%) 100%);
  }

  .card-title {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 800;
    color: color-mix(in srgb, var(--text) 92%, transparent);
  }

  .card-subtitle {
    margin: 2px 0 0;
    font-size: 0.76rem;
    color: var(--muted);
  }

  .main-grid { margin-bottom: 10px; }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 12px;
    align-items: stretch;
  }

  .tables-grid > .card {
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }

  .tables-grid > .card + .card {
    margin-top: 0;
  }

  .tables-grid > .card .table-scroll {
    flex: 1;
    max-height: none;
  }

  #map {
    height: 556px;
    width: 100%;
    border-radius: 14px;
  }

  .table-scroll {
    max-height: 540px;
    overflow: auto;
    scrollbar-gutter: stable both-edges;
    scrollbar-width: thin;
    scrollbar-color: color-mix(in srgb, var(--primary) 56%, var(--line) 44%) color-mix(in srgb, var(--surface) 84%, transparent);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.83rem;
    font-variant-numeric: lining-nums tabular-nums;
  }

  th,
  td {
    padding: 9px 8px;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: color-mix(in srgb, var(--surface-alt) 94%, #fff 6%);
    color: color-mix(in srgb, var(--muted) 72%, var(--text) 28%);
    font-size: 0.75rem;
    text-transform: none;
    letter-spacing: 0.09px;
    font-weight: 800;
    white-space: nowrap;
  }

  tbody tr:hover td {
    background: color-mix(in srgb, var(--surface) 86%, #dffffc 14%);
  }

  tbody tr:nth-child(even) td {
    background: color-mix(in srgb, var(--surface) 94%, #fff 6%);
  }

  .country-cell {
    font-weight: 700;
    white-space: nowrap;
  }

  .country-flag {
    font-size: 1rem;
    margin-right: 5px;
  }

  .num {
    text-align: right;
    white-space: nowrap;
  }

  .table-scroll table {
    width: max-content;
    min-width: 100%;
  }

  .country-table,
  .timeline-table {
    table-layout: auto;
  }

  .country-table {
    min-width: 1520px;
  }

  .timeline-table {
    min-width: 1640px;
  }

  .obs-region-table {
    min-width: 1480px;
  }

  .country-table th:nth-child(1),
  .country-table td:nth-child(1) { width: 150px; }
  .country-table th:nth-child(2),
  .country-table td:nth-child(2) { width: 100px; }
  .country-table th:nth-child(3),
  .country-table td:nth-child(3) { width: 74px; }
  .country-table th:nth-child(4),
  .country-table td:nth-child(4) { width: 74px; }
  .country-table th:nth-child(5),
  .country-table td:nth-child(5) { width: 80px; }
  .country-table th:nth-child(6),
  .country-table td:nth-child(6) { width: 74px; }
  .country-table th:nth-child(7),
  .country-table td:nth-child(7) { width: 88px; }
  .country-table th:nth-child(8),
  .country-table td:nth-child(8) { width: 116px; }
  .country-table th:nth-child(9),
  .country-table td:nth-child(9) { width: 680px; }

  .timeline-table th:nth-child(1),
  .timeline-table td:nth-child(1) { width: 108px; }
  .timeline-table th:nth-child(2),
  .timeline-table td:nth-child(2) { width: 112px; }
  .timeline-table th:nth-child(3),
  .timeline-table td:nth-child(3) { width: 74px; }
  .timeline-table th:nth-child(4),
  .timeline-table td:nth-child(4) { width: 74px; }
  .timeline-table th:nth-child(5),
  .timeline-table td:nth-child(5) { width: 88px; }
  .timeline-table th:nth-child(6),
  .timeline-table td:nth-child(6) { width: 980px; }

  .obs-region-table th:nth-child(1),
  .obs-region-table td:nth-child(1) { width: 112px; }
  .obs-region-table th:nth-child(2),
  .obs-region-table td:nth-child(2) { width: 220px; }
  .obs-region-table th:nth-child(3),
  .obs-region-table td:nth-child(3) { width: 96px; }
  .obs-region-table th:nth-child(4),
  .obs-region-table td:nth-child(4) { width: 190px; }
  .obs-region-table th:nth-child(5),
  .obs-region-table td:nth-child(5) { width: 900px; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    font-size: 0.71rem;
    font-weight: 800;
  }

  .badge-confirmed {
    background: color-mix(in srgb, var(--primary) 16%, transparent);
    color: var(--primary);
  }

  .badge-death {
    background: color-mix(in srgb, var(--danger) 16%, transparent);
    color: var(--danger);
  }

  .country-notes,
  .timeline-event {
    color: color-mix(in srgb, var(--text) 70%, var(--muted) 30%);
    line-height: 1.42;
    white-space: nowrap;
  }

  .dot-legend {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 0.74rem;
  }

  .dot-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .dot.blue { background: var(--primary); }
  .dot.orange { background: var(--warning); }
  .dot.red { background: var(--danger); }
  .dot.teal { background: var(--ok); }
  .dot.gold { background: #d7a208; }
  .dot.route { background: #f48fb1; }

  .status-pill {
    display: inline-flex;
    align-items: center;
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 0.72rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .status-counted {
    color: var(--ok);
    background: color-mix(in srgb, var(--ok) 22%, transparent);
  }

  .status-reported {
    color: #b3800f;
    background: color-mix(in srgb, var(--warning) 22%, transparent);
  }

  .status-none {
    color: var(--muted);
    background: color-mix(in srgb, var(--line) 45%, transparent);
  }

  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .control-row label {
    font-size: 0.76rem;
    color: var(--muted);
    font-weight: 700;
  }

  .control-row select {
    border: 2px solid color-mix(in srgb, var(--line) 85%, transparent);
    background: color-mix(in srgb, var(--surface) 92%, #fff 8%);
    color: var(--text);
    border-radius: 12px;
    padding: 6px 10px;
    font-size: 0.82rem;
    box-shadow: inset 0 0 0 1px transparent;
    font-weight: 700;
  }

  .control-row select:focus {
    outline: none;
    box-shadow: var(--glow);
  }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }

  .charts-grid > .card {
    min-height: 446px;
    display: flex;
    flex-direction: column;
  }

  .charts-grid > .card + .card {
    margin-top: 0;
  }

  .chart-wrap {
    height: 360px;
    min-height: 360px;
    flex: 1;
    padding: 9px 13px 13px;
    background:
      linear-gradient(180deg, color-mix(in srgb, var(--surface-alt) 70%, transparent) 0%, transparent 26%),
      color-mix(in srgb, var(--surface) 96%, transparent);
  }

  .news-list,
  .source-list,
  .watch-list {
    margin: 0;
    padding: 10px 14px 14px;
    list-style: none;
  }

  .news-item,
  .watch-item {
    padding: 10px 4px 10px 10px;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
    border-left: 3px solid transparent;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .news-item:hover,
  .watch-item:hover {
    border-left-color: color-mix(in srgb, var(--primary) 64%, var(--warning) 36%);
    background: color-mix(in srgb, var(--surface-alt) 54%, transparent);
  }

  .news-item:last-child,
  .watch-item:last-child {
    border-bottom: 0;
  }

  .news-date {
    color: var(--primary);
    font-size: 0.74rem;
    font-weight: 800;
  }

  .news-title,
  .watch-title {
    margin: 4px 0;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .news-summary,
  .watch-note {
    margin: 0;
    color: color-mix(in srgb, var(--text) 72%, var(--muted) 28%);
    font-size: 0.84rem;
  }

  .news-source,
  .watch-source {
    margin-top: 5px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .news-source a,
  .source-list a,
  .watch-source a {
    color: var(--primary-strong);

  function safeDataCheck() {
    if (!data || !Array.isArray(data.countries) || !Array.isArray(data.timeline) || !data.series) {
      document.body.innerHTML = "<div style='padding:24px;font-family:sans-serif'>Data missing: check outbreak-data.js</div>";
      return false;
    }
    return true;
  }

  function t() {
    return i18n[state.lang];
  }

  function findSourceById(id) {
    return data.sources.find((item) => item.id === id) || null;
  }

  function countryName(c) {
    return state.lang === "zh" ? c.countryZh : c.countryEn;
  }

  function continentNameByCode(code) {
    const match = data.continents.find((item) => item.code === code);
    if (!match) return code;
    return state.lang === "zh" ? match.zh : match.en;
  }

  function fmtNumber(v) {
    return Number.isFinite(v) ? v : 0;
  }

  function buildConfirmedSeries(confirmed, confirmedDeaths, labels) {
    const safeConfirmed = labels.map((_, i) => fmtNumber(confirmed?.[i]));
    const safeDeaths = labels.map((_, i) => {
      const deathsVal = fmtNumber(confirmedDeaths?.[i]);
      return Math.min(deathsVal, safeConfirmed[i]);
    });
    return { safeConfirmed, safeDeaths };
  }

  function buildPlainSeries(raw, labels) {
    return labels.map((_, i) => fmtNumber(raw?.[i]));
  }

  function renderDailySummary() {
    const lang = t();
    const sorted = [...data.timeline].sort((a, b) => new Date(b.date) - new Date(a.date));
    const latestDate = sorted.length ? sorted[0].date : data.meta.lastUpdatedDate;
    const sameDay = sorted.filter((item) => item.date === latestDate);

    const confirmedAdd = sameDay.reduce((sum, item) => sum + (item.confirmedDelta || 0), 0);
    const deathsAdd = sameDay.reduce((sum, item) => sum + (item.deathsDelta || 0), 0);
    const observedAdd = sameDay.reduce((sum, item) => sum + (item.observedDelta || 0), 0);

    const countriesSet = new Set(
      sameDay
        .map((item) => (state.lang === "zh" ? item.countryZh : item.countryEn))
        .filter((name) => name && !name.includes("WHO"))
    );

    document.getElementById("dailyTitle").textContent = lang.dailyTitle;
    document.getElementById("dailyChip").textContent = lang.dailyChip;

    const rows = [
      { k: lang.dailyFields.date, v: latestDate },
      { k: lang.dailyFields.confirmed, v: confirmedAdd },
      { k: lang.dailyFields.deaths, v: deathsAdd },
      { k: lang.dailyFields.observed, v: observedAdd },
      { k: lang.dailyFields.countries, v: countriesSet.size }

    document.getElementById("dailyGrid").innerHTML = rows.map((item) => `

  function renderCountryTable() {
    const body = document.getElementById("countryBody");
    body.innerHTML = "";

    const sorted = [...data.countries].sort((a, b) => {
      const scoreA = (a.confirmed + a.probable) * 100 + a.deaths;
      const scoreB = (b.confirmed + b.probable) * 100 + b.deaths;
      return scoreB - scoreA;
    });

    sorted.forEach((country) => {
      const total = country.confirmed + country.probable;
      const continent = state.lang === "zh" ? country.continentZh : country.continentEn;

      body.innerHTML += `
        <tr>
          <td class="country-cell"><span class="country-flag">${country.flag || "🌐"}</span>${countryName(country)}</td>
          <td>${continent}</td>
          <td class="num">${fmtNumber(country.confirmed)}</td>

  function renderTimeline() {
    const body = document.getElementById("timelineBody");
    body.innerHTML = "";

    const sorted = [...data.timeline].sort((a, b) => {
      if (a.date === b.date) {
        return (b.confirmedDelta + b.deathsDelta + (b.observedDelta || 0))
          - (a.confirmedDelta + a.deathsDelta + (a.observedDelta || 0));
      }
      return new Date(b.date) - new Date(a.date);
    });

    sorted.forEach((item) => {
      const country = state.lang === "zh" ? item.countryZh : item.countryEn;
      body.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td>${country}</td>
          <td class="num">${item.confirmedDelta > 0 ? `<span class="badge badge-confirmed">+${item.confirmedDelta}</span>` : "0"}</td>

  function buildObservationControls() {
    const lang = t();
    const countrySelect = document.getElementById("obsCountry");
    const statusSelect = document.getElementById("obsStatus");

    const countries = observationCountryRows()
      .map((item) => {
        const c = countryLookup[item.code];
        const name = c ? countryName(c) : (state.lang === "zh" ? item.countryZh : item.countryEn);
        return {
          value: item.code,
          label: `${c?.flag || "🌐"} ${name}`
        };
      })
      .sort((a, b) => a.label.localeCompare(b.label));

    const countryOptions = [{ value: "ALL", label: lang.obsCountryAll }].concat(countries);
    countrySelect.innerHTML = countryOptions.map((opt) => `<option value="${opt.value}">${opt.label}</option>`).join("");
    countrySelect.value = countryOptions.some((opt) => opt.value === state.obsCountry) ? state.obsCountry : "ALL";
    state.obsCountry = countrySelect.value;

    const statusKeys = Object.keys(lang.obsStatusMap || {});
    const statusOptions = [{ value: "ALL", label: lang.obsStatusAll }].concat(
      statusKeys.map((key) => ({ value: key, label: observationStatusLabel(key) }))
    );
    statusSelect.innerHTML = statusOptions.map((opt) => `<option value="${opt.value}">${opt.label}</option>`).join("");
    statusSelect.value = statusOptions.some((opt) => opt.value === state.obsStatus) ? state.obsStatus : "ALL";
    state.obsStatus = statusSelect.value;
  }

  function renderObservationRegions() {
    buildObservationControls();
    const body = document.getElementById("obsRegionBody");
    const lang = t();
    body.innerHTML = "";

    const countries = observationCountryRows();
    const selectedCountries = state.obsCountry === "ALL"
      ? countries.map((item) => item.code)
      : [state.obsCountry];

    const rows = [];
    selectedCountries.forEach((code) => {
      const c = countryLookup[code] || null;
      const cName = c ? `${c.flag || "🌐"} ${countryName(c)}` : code;
      observationRegionRows(code).forEach((row) => {
        if (state.obsStatus !== "ALL" && row.status !== state.obsStatus) return;
        rows.push({
          code,
          countryName: cName,
          region: state.lang === "zh" ? row.regionZh : row.regionEn,
          observed: fmtNumber(row.observed),
          status: row.status,
          sourceIds: row.sourceIds || []
        });
      });
    });

    rows.sort((a, b) => {
      if (a.observed !== b.observed) return b.observed - a.observed;
      if (a.countryName !== b.countryName) return a.countryName.localeCompare(b.countryName);
      return a.region.localeCompare(b.region);
    });

    if (!rows.length) {
      body.innerHTML = `<tr><td colspan="5">${state.lang === "zh" ? "无匹配记录" : "No matching records"}</td></tr>`;
      return;
    }

    rows.forEach((row) => {
      const sourceLinks = row.sourceIds
        .map((id) => {
          const source = findSourceById(id);
          if (!source) return null;
          return `<a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.publisher}</a>`;
        })
        .filter(Boolean)
        .join(" / ");

      body.innerHTML += `
        <tr>
          <td>${row.countryName}</td>
          <td>${row.region}</td>
          <td class="num">${row.observed}</td>
          <td><span class="status-pill ${observationStatusClass(row.status)}">${observationStatusLabel(row.status)}</span></td>
          <td>${sourceLinks || lang.noSource}</td>
        </tr>
      `;
    });
  }

      list.innerHTML += `
        <li class="news-item">

          <p class="news-summary">${item.summary[state.lang]}</p>
          <div class="news-source">${lang.sourceLabel}: ${sourceText}</div>
        </li>

    });

    if (!btn) return;
    const hasMore = state.newsLimit < sorted.length;
    btn.textContent = hasMore ? `${lang.newsMore} (${sorted.length - state.newsLimit})` : lang.newsCollapse;
    btn.disabled = sorted.length <= state.newsStep;
    btn.style.display = sorted.length > state.newsStep ? "inline-flex" : "none";

    const grid = document.getElementById("benchmarkGrid");
    const subtitle = document.getElementById("benchmarkSubtitle");

    const benchmark = data.meta?.externalBenchmarks || {};
    const checkedAt = benchmark.checkedAt || data.meta.lastUpdatedAt || "";
    subtitle.textContent = `${lang.benchmarkSubtitle} ${lang.benchmarkCheckedPrefix}${checkedAt}`;

    const items = Array.isArray(benchmark.items) ? benchmark.items : [];
    if (!items.length) {
      grid.innerHTML = `<div class="benchmark-item">${lang.noSource}</div>`;
      return;
    }

    grid.innerHTML = items.map((item) => {
      const name = item.name?.[state.lang] || item.id || "-";
      const method = item.method?.[state.lang] || "-";
      const metricRows = Object.entries(item.metrics || {}).map(([key, value]) => {
        const k = lang.benchmarkMetricMap?.[key] || key;
        const v = typeof value === "number" ? value.toLocaleString() : String(value);
        return `<li><span>${k}</span><strong>${v}</strong></li>`;
      }).join("");

      const sourceLinks = (item.sourceIds || []).map((id) => {
        const source = findSourceById(id);
        if (!source) return null;
        return `<a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.publisher}</a>`;
      }).filter(Boolean);

      return `
        <article class="benchmark-item">
          <p class="benchmark-name">${name}</p>
          <div class="benchmark-link"><a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.url}</a></div>
          <div class="benchmark-row-title">${lang.benchmarkMethodLabel}</div>
          <p class="benchmark-method">${method}</p>
          <div class="benchmark-row-title">${lang.benchmarkMetricsLabel}</div>
          <ul class="benchmark-metrics">${metricRows}</ul>
          <div class="benchmark-row-title">${lang.benchmarkSourcesLabel}</div>
          <div class="benchmark-sources">${sourceLinks.length ? sourceLinks.join(" / ") : lang.noSource}</div>
        </article>
      `;
    }).join("");
  }

  function renderSources() {
    const list = document.getElementById("sourceList");
    list.innerHTML = "";

    [...(data.sources || [])]
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .forEach((source) => {
        list.innerHTML += `<li><strong>${source.publisher}</strong> · ${source.date} · <a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.title}</a></li>`;
      });
  }

  function normalizeRegionToken(value) {
    return String(value || "")
      .toLowerCase()
      .replace(/[^a-z0-9\u4e00-\u9fa5]+/g, "");
  }

  const observationRegionMaps = {};

  function getObservationRegionMaps(countryCode) {
    const key = String(countryCode || "").toUpperCase();
    if (observationRegionMaps[key]) return observationRegionMaps[key];

    const rows = observationRegionRows(key);
    const byCode = new Map();
    const byEn = new Map();
    const byZh = new Map();

    rows.forEach((row) => {
      if (row.regionCode) byCode.set(String(row.regionCode).toUpperCase(), row);
      if (row.regionEn) byEn.set(normalizeRegionToken(row.regionEn), row);
      if (row.regionZh) byZh.set(normalizeRegionToken(row.regionZh), row);
    });

    observationRegionMaps[key] = { byCode, byEn, byZh };
    return observationRegionMaps[key];
  }

  function findObservationRegion(countryCode, regionCode, nameEn, nameZh) {
    const maps = getObservationRegionMaps(countryCode);
    const codeKey = String(regionCode || "").toUpperCase();
    if (codeKey && maps.byCode.has(codeKey)) return maps.byCode.get(codeKey);

    const enKey = normalizeRegionToken(nameEn);
    if (enKey && maps.byEn.has(enKey)) return maps.byEn.get(enKey);

    const zhKey = normalizeRegionToken(nameZh);
    if (zhKey && maps.byZh.has(zhKey)) return maps.byZh.get(zhKey);

    return null;
  }

  function admin1Status(region) {
    if (!region) return "none";
    if ((region.observed || 0) > 0) return "counted";
    if (region.status === "reported_no_count") return "reported_no_count";
    if (region.status === "no_reported_monitoring") return "no_reported_monitoring";
    return "none";
  }

  function countryStatus(country) {
    if (!country) return "none";
    if ((country.deaths || 0) > 0) return "death";
    if ((country.probable || 0) > 0) return "probable";
    if ((country.confirmed || 0) > 0) return "confirmed";
    if ((country.observed || 0) > 0) return "observed";
    return "none";
  }

  function mapPalette() {
    if (state.theme === "night") {
      return {
        none: { fillColor: "#263447", borderColor: "#4b607c", fillOpacity: 0.22, weight: 0.62 },
        confirmed: { fillColor: "#5f9be6", borderColor: "#dbe8ff", fillOpacity: 0.64, weight: 0.98 },
        probable: { fillColor: "#ffcc6e", borderColor: "#fff1c8", fillOpacity: 0.72, weight: 1.06 },
        observed: { fillColor: "#4bdccc", borderColor: "#d4fff9", fillOpacity: 0.68, weight: 1.02 },
        death: { fillColor: "#ff8782", borderColor: "#ffd5d2", fillOpacity: 0.76, weight: 1.15 }
      };
    }

    return {
      none: { fillColor: "#dfd5bf", borderColor: "#c8b9a1", fillOpacity: 0.36, weight: 0.66 },
      confirmed: { fillColor: "#3f89d8", borderColor: "#ffffff", fillOpacity: 0.62, weight: 0.98 },
      probable: { fillColor: "#f5c31c", borderColor: "#ffffff", fillOpacity: 0.68, weight: 1.06 },
      observed: { fillColor: "#19c8b9", borderColor: "#ffffff", fillOpacity: 0.66, weight: 1.02 },
      death: { fillColor: "#e05a5a", borderColor: "#ffffff", fillOpacity: 0.74, weight: 1.15 }
    };
  }

  function admin1Palette() {
    if (state.theme === "night") {
      return {
        none: { fillColor: "#000000", borderColor: "#60708f", fillOpacity: 0, weight: 0.45 },
        counted: { fillColor: "#4bdccc", borderColor: "#e1fffb", fillOpacity: 0.84, weight: 0.94 },
        reported_no_count: { fillColor: "#ffd166", borderColor: "#fff3cf", fillOpacity: 0.8, weight: 0.9 },
        no_reported_monitoring: { fillColor: "#2f3d52", borderColor: "#677b9f", fillOpacity: 0.14, weight: 0.4 }
      };
    }

    return {
      none: { fillColor: "#ffffff", borderColor: "#bcae97", fillOpacity: 0, weight: 0.42 },
      counted: { fillColor: "#19c8b9", borderColor: "#ffffff", fillOpacity: 0.84, weight: 0.94 },
      reported_no_count: { fillColor: "#e8b30f", borderColor: "#ffffff", fillOpacity: 0.8, weight: 0.9 },
      no_reported_monitoring: { fillColor: "#d8ceba", borderColor: "#c6b79d", fillOpacity: 0.16, weight: 0.38 }
    };
  }

  function featureCountryCode(feature) {
    const rawCode = feature?.properties?.iso_a2 || feature?.properties?.["ISO3166-1-Alpha-2"] || "";
    return typeof rawCode === "string" ? rawCode.toUpperCase() : "";
  }

  function countryObservedDetails(countryCode) {
    const rows = data.observation?.regionBreakdown?.[countryCode];
    if (!Array.isArray(rows) || !rows.length) return "";

    const quantified = rows.filter((row) => (row.observed || 0) > 0);
    const reportedNoCount = rows.filter((row) => row.status === "reported_no_count");
    if (!quantified.length && !reportedNoCount.length) return "";

    const quantifiedText = quantified
      .sort((a, b) => (b.observed || 0) - (a.observed || 0))
      .slice(0, 8)
      .map((row) => `${state.lang === "zh" ? row.regionZh : row.regionEn}: ${row.observed}`)
      .join("；");

    const pendingText = reportedNoCount
      .slice(0, 8)
      .map((row) => state.lang === "zh" ? row.regionZh : row.regionEn)
      .join("、");

    const chunks = [];
    if (quantifiedText) {
      chunks.push(state.lang === "zh"
        ? `省/州量化：${quantifiedText}`
        : `Quantified states/provinces: ${quantifiedText}`);
    }
    if (pendingText) {
      chunks.push(state.lang === "zh"
        ? `已通报未披露人数：${pendingText}`
        : `Reported without numeric count: ${pendingText}`);
    }
    return `<div style="margin-top:6px;color:#5f6d8f;">${chunks.join("<br>")}</div>`;
  }

  function countryGeoPopup(country, fallbackName) {
    if (!country) {
      const unknownLabel = state.lang === "zh" ? "无病例通报" : "No reported cases";
      const unknownText = state.lang === "zh" ? "当前数据集中该国家暂无病例记录。" : "No case record for this country in the current dataset.";
      return `<strong>${fallbackName}</strong><br>${unknownLabel}<br><div style="margin-top:6px;color:#5f6d8f;">${unknownText}</div>`;
    }

    return `
      <strong>${country.flag || "🌐"} ${countryName(country)}</strong><br>
      ${state.lang === "zh" ? "大洲" : "Continent"}: ${state.lang === "zh" ? country.continentZh : country.continentEn}<br>
      ${state.lang === "zh" ? "确诊" : "Confirmed"}: ${country.confirmed}<br>
      ${state.lang === "zh" ? "可能" : "Probable"}: ${country.probable}<br>
      ${state.lang === "zh" ? "死亡" : "Deaths"}: ${country.deaths}<br>
      ${state.lang === "zh" ? "被观测者" : "Observed"}: ${country.observed || 0}<br>
      ${state.lang === "zh" ? "最后更新" : "Last update"}: ${country.lastUpdate}<br>
      <div style="margin-top:6px;color:#5f6d8f;">${country.notes[state.lang]}</div>
      ${countryObservedDetails(country.code)}
    `;
  }

  function countryGeoStyle(feature) {
    const code = featureCountryCode(feature);
    const country = countryLookup[code] || null;
    const palette = mapPalette();
    const swatch = palette[countryStatus(country)] || palette.none;
    return {
      color: swatch.borderColor,
      weight: swatch.weight,
      fillColor: swatch.fillColor,
      fillOpacity: swatch.fillOpacity
    };
  }

  function bindCountryGeoEvents(feature, layer) {
    layer.on({
      mouseover: (e) => {
        const base = countryGeoStyle(e.target.feature);
        e.target.setStyle({
          ...base,
          weight: (base.weight || 1) + 0.8,
          fillOpacity: Math.min((base.fillOpacity || 0.4) + 0.12, 0.86)
        });
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
          e.target.bringToFront();
        }
      },
      mouseout: (e) => {
        if (state.countryGeoLayer) state.countryGeoLayer.resetStyle(e.target);
      },
      click: (e) => {
        const feature = e.target.feature;
        const code = featureCountryCode(feature);
        const country = countryLookup[code] || null;
        const fallbackName = feature?.properties?.name || feature?.properties?.admin || code || (state.lang === "zh" ? "未知国家" : "Unknown country");
        e.target.bindPopup(countryGeoPopup(country, fallbackName)).openPopup();
      }
    });
  }

  function admin1CountryCode(feature) {
    return String(feature?.properties?.iso_a2 || "").toUpperCase();
  }

  function admin1RegionCode(feature) {
    return String(feature?.properties?.iso_3166_2 || "").toUpperCase();
  }

  function admin1RegionName(feature) {
    const p = feature?.properties || {};
    if (state.lang === "zh") return p.name_zh || p.name_en || p.name || admin1RegionCode(feature);
    return p.name_en || p.name || p.name_zh || admin1RegionCode(feature);
  }

  function admin1RegionRecord(feature) {
    const countryCode = admin1CountryCode(feature);
    const p = feature?.properties || {};
    return findObservationRegion(countryCode, admin1RegionCode(feature), p.name_en || p.name, p.name_zh || p.name);
  }

  function admin1Style(feature) {
    const palette = admin1Palette();
    const status = admin1Status(admin1RegionRecord(feature));
    const swatch = palette[status] || palette.none;
    return {
      color: swatch.borderColor,
      weight: swatch.weight,
      fillColor: swatch.fillColor,
      fillOpacity: swatch.fillOpacity
    };
  }

  function admin1Popup(feature) {
    const countryCode = admin1CountryCode(feature);
    const country = countryLookup[countryCode] || null;
    const region = admin1RegionRecord(feature);
    const regionName = admin1RegionName(feature);
    const title = `${country?.flag || "🌐"} ${country ? countryName(country) : countryCode} · ${regionName}`;

    if (!region) {
      return `
        <strong>${title}</strong><br>
        ${state.lang === "zh" ? "暂无可匹配的省州观测记录。" : "No matched province/state observation record."}
      `;
    }

    const links = (region.sourceIds || []).map((id) => {
      const source = findSourceById(id);
      if (!source) return null;
      return `<a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.publisher}</a>`;
    }).filter(Boolean).join(" / ");

    return `
      <strong>${title}</strong><br>
      ${state.lang === "zh" ? "被观测者" : "Observed"}: ${region.observed || 0}<br>
      ${state.lang === "zh" ? "状态" : "Status"}: ${observationStatusLabel(region.status)}<br>
      ${state.lang === "zh" ? "来源" : "Sources"}: ${links || t().noSource}
    `;
  }

  function bindAdmin1Events(feature, layer) {
    layer.on({
      mouseover: (e) => {
        const base = admin1Style(e.target.feature);
        e.target.setStyle({
          ...base,
          weight: (base.weight || 0.6) + 0.65,
          fillOpacity: Math.min((base.fillOpacity || 0.4) + 0.14, 0.86)
        });
      },
      mouseout: (e) => {
        if (state.admin1GeoLayer) state.admin1GeoLayer.resetStyle(e.target);
      },
      click: (e) => {
        e.target.bindPopup(admin1Popup(e.target.feature)).openPopup();
      }
    });
  }

  function routeStyle() {
    if (state.theme === "night") {
      return {
        lineColor: "#f472b6",
        lineGlow: "rgba(244, 114, 182, 0.2)",
        markerColor: "#f9a8d4",
        markerFill: "#be185d",
        textColor: "#fce7f3"
      };
    }
    return {
      lineColor: "#db2777",
      lineGlow: "rgba(219, 39, 119, 0.18)",
      markerColor: "#ffffff",
      markerFill: "#db2777",
      textColor: "#831843"
    };
  }

  function renderVoyageRoute() {
    if (!state.map) return;
    if (state.voyageLayer) {
      state.map.removeLayer(state.voyageLayer);
      state.voyageLayer = null;
    }

    const style = routeStyle();
    const group = L.layerGroup();
    const latlngs = VOYAGE_ROUTE_POINTS.map((p) => [p.lat, p.lng]);
    const line = L.polyline(latlngs, {
      pane: ROUTE_PANE,
      color: style.lineColor,
      weight: 2.5,
      opacity: 0.95
    });
    const glow = L.polyline(latlngs, {
      pane: ROUTE_PANE,
      color: style.lineGlow,
      weight: 8,
      opacity: 0.85
    });
    glow.addTo(group);
    line.addTo(group);

    VOYAGE_ROUTE_POINTS.forEach((point, idx) => {
      const marker = L.circleMarker([point.lat, point.lng], {
        pane: ROUTE_PANE,
        radius: 4.2,
        color: style.markerColor,
        weight: 1.2,
        fillColor: style.markerFill,
        fillOpacity: 0.92
      });
      const label = `${idx + 1}. ${state.lang === "zh" ? point.nameZh : point.nameEn}`;
      marker.bindTooltip(label, {
        direction: "top",
        offset: [0, -5],
        opacity: 0.95
      });
      marker.bindPopup(`<strong>${label}</strong>`);
      marker.addTo(group);
    });

    group.addTo(state.map);
    state.voyageLayer = group;
  }

  function markerColor(country) {
    if (country.deaths > 0) return "#d92d20";
    if (country.probable > 0) return "#f97316";
    if (country.confirmed === 0 && (country.observed || 0) > 0) return "#0f766e";
    return "#1f4ed8";
  }

  function markerRadius(country) {
    const total = country.confirmed + country.probable;
    return 5 + Math.min(total * 2.4, 12);
  }

  function clearMarkers() {
    state.markers.forEach((m) => m.remove());
    state.markers = [];
  }

  function drawMarkersFallback() {
    if (!state.map) return;
    clearMarkers();

    data.countries.forEach((country) => {
      const marker = L.circleMarker([country.lat, country.lng], {
        radius: markerRadius(country),
        color: "#ffffff",
        weight: 1.5,
        fillColor: markerColor(country),
        fillOpacity: 0.9
      }).addTo(state.map);

      marker.bindPopup(countryGeoPopup(country, countryName(country)));
      state.markers.push(marker);
    });
  }

  function applyChoroplethTheme() {
    if (state.countryGeoLayer) {
      state.countryGeoLayer.setStyle((feature) => countryGeoStyle(feature));
    }
    if (state.admin1GeoLayer) {
      state.admin1GeoLayer.setStyle((feature) => admin1Style(feature));
    }
    renderVoyageRoute();
  }

  async function ensureAdmin1Choropleth() {
    if (!state.map) return;

    try {
      if (!state.admin1GeoData) {
        if (window.ADMIN1_CN_US_RU_GEOJSON) {
          state.admin1GeoData = window.ADMIN1_CN_US_RU_GEOJSON;
        } else {
          const res = await fetch(ADMIN1_GEOJSON_URL, { cache: "force-cache" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          state.admin1GeoData = await res.json();
        }
      }

      if (!state.admin1GeoLayer) {
        state.admin1GeoLayer = L.geoJSON(state.admin1GeoData, {
          pane: ADMIN1_PANE,
          style: (feature) => admin1Style(feature),
          onEachFeature: bindAdmin1Events
        }).addTo(state.map);
      } else {
        state.admin1GeoLayer.setStyle((feature) => admin1Style(feature));
      }
    } catch (err) {
      console.warn("Admin1 choropleth loading failed.", err);
      if (state.admin1GeoLayer && state.map.hasLayer(state.admin1GeoLayer)) {
        state.map.removeLayer(state.admin1GeoLayer);
      }
      state.admin1GeoLayer = null;
    }
  }

  async function ensureCountryChoropleth() {
    if (!state.map) return;

    try {
      if (!state.countryGeoData) {
        const res = await fetch(COUNTRY_GEOJSON_URL, { cache: "force-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        state.countryGeoData = await res.json();
      }

      clearMarkers();

      if (!state.countryGeoLayer) {
        state.countryGeoLayer = L.geoJSON(state.countryGeoData, {
          pane: COUNTRY_PANE,
          style: (feature) => countryGeoStyle(feature),
          onEachFeature: bindCountryGeoEvents
        }).addTo(state.map);
      } else {
        state.countryGeoLayer.setStyle((feature) => countryGeoStyle(feature));
      }

      await ensureAdmin1Choropleth();
      applyChoroplethTheme();
    } catch (err) {
      console.warn("Country choropleth loading failed, fallback to markers.", err);
      if (state.countryGeoLayer && state.map.hasLayer(state.countryGeoLayer)) {
        state.map.removeLayer(state.countryGeoLayer);
      }
      state.countryGeoLayer = null;
      if (state.admin1GeoLayer && state.map.hasLayer(state.admin1GeoLayer)) {
        state.map.removeLayer(state.admin1GeoLayer);
      }
      state.admin1GeoLayer = null;
      drawMarkersFallback();
      renderVoyageRoute();
    }
  }

  function initMap() {
    state.map = L.map("map", {
      zoomControl: true,
      minZoom: 2,
      maxZoom: 6
    }).setView([23, 10], 2);

    state.map.createPane(COUNTRY_PANE);
    state.map.getPane(COUNTRY_PANE).style.zIndex = "420";
    state.map.createPane(ADMIN1_PANE);
    state.map.getPane(ADMIN1_PANE).style.zIndex = "430";
    state.map.createPane(ROUTE_PANE);
    state.map.getPane(ROUTE_PANE).style.zIndex = "440";

    state.mapBaseLayers = {
      light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }),
      dark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      })
    };

    applyMapTheme();
    ensureCountryChoropleth();
  }

  function applyMapTheme() {
    if (!state.map || !state.mapBaseLayers) return;

    const target = state.theme === "night" ? "dark" : "light";
    if (state.activeBaseKey === target) {
      applyChoroplethTheme();
      return;
    }

    if (state.activeBaseLayer && state.map.hasLayer(state.activeBaseLayer)) {
      state.map.removeLayer(state.activeBaseLayer);
    }

    const nextLayer = state.mapBaseLayers[target];
    nextLayer.addTo(state.map);
    state.activeBaseLayer = nextLayer;
    state.activeBaseKey = target;
    applyChoroplethTheme();
  }

  function buildTrendScopeOptions() {
    const lang = t();
    const select = document.getElementById("trendScope");
    const current = select.value || "GLOBAL";

    const options = [{ value: "GLOBAL", label: lang.global }]
      .concat(
        [...data.countries]
          .sort((a, b) => countryName(a).localeCompare(countryName(b)))
          .map((country) => ({ value: country.code, label: `${country.flag || "🌐"} ${countryName(country)}` }))
      );

    select.innerHTML = options.map((opt) => `<option value="${opt.value}">${opt.label}</option>`).join("");
    select.value = options.some((opt) => opt.value === current) ? current : "GLOBAL";
  }

  function trendData(scope) {
    const labels = data.series.dates;

    if (scope === "GLOBAL") {
      const normalized = buildConfirmedSeries(
        data.series.global.confirmed,
        data.series.global.confirmedDeaths,
        labels
      );
      return {
        labels,
        confirmed: normalized.safeConfirmed,
        deathsConfirmed: normalized.safeDeaths,
        observed: buildPlainSeries(data.series.global.observed, labels)
      };
    }

    const series = data.series.byCountry[scope];
    if (!series) {
      return {
        labels,
        confirmed: labels.map(() => 0),
        deathsConfirmed: labels.map(() => 0),
        observed: labels.map(() => 0)
      };
    }

    const normalized = buildConfirmedSeries(series.confirmed, series.confirmedDeaths, labels);
    return {
      labels,
      confirmed: normalized.safeConfirmed,
      deathsConfirmed: normalized.safeDeaths,
      observed: buildPlainSeries(series.observed, labels)
    };
  }

  function trendSeriesPalette() {
    if (state.theme === "night") {
      return {
        confirmedBorder: "#73b1ff",
        confirmedFill: "rgba(115, 177, 255, 0.2)",
        deathsBorder: "#ff8f87",
        deathsFill: "rgba(255, 143, 135, 0.16)",
        observedBorder: "#4bdccc",
        observedFill: "rgba(75, 220, 204, 0.16)"
      };
    }

    return {
      confirmedBorder: "#3f89d8",
      confirmedFill: "rgba(63, 137, 216, 0.16)",
      deathsBorder: "#e05a5a",
      deathsFill: "rgba(224, 90, 90, 0.14)",
      observedBorder: "#19c8b9",
      observedFill: "rgba(25, 200, 185, 0.14)"
    };
  }

  function renderTrendChart() {
    const lang = t();
    const scope = document.getElementById("trendScope").value;
    const series = trendData(scope);
    const palette = trendSeriesPalette();

    if (state.trendChart) state.trendChart.destroy();

    state.trendChart = new Chart(document.getElementById("trendChart"), {
      type: "line",
      data: {
        labels: series.labels,
        datasets: [
          {
            label: lang.trendSeries.confirmed,
            data: series.confirmed,
            borderColor: palette.confirmedBorder,
            backgroundColor: palette.confirmedFill,
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            borderWidth: 2.4
          },
          {
            label: lang.trendSeries.deaths,
            data: series.deathsConfirmed,
            borderColor: palette.deathsBorder,
            backgroundColor: palette.deathsFill,
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            borderWidth: 2.4,
            borderDash: [6, 4]
          },
          {
            label: lang.trendSeries.observed,
            data: series.observed,
            borderColor: palette.observedBorder,
            backgroundColor: palette.observedFill,
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            borderWidth: 2.2,
            pointStyle: "triangle"
          }
        ]
      },
      options: chartOptions()
    });
  }

  function buildContinentScopeOptions() {
    const select = document.getElementById("continentScope");
    const current = select.value || "GLOBAL";

    select.innerHTML = data.continents
      .map((item) => `<option value="${item.code}">${state.lang === "zh" ? item.zh : item.en}</option>`)
      .join("");

    select.value = data.continents.some((item) => item.code === current) ? current : "GLOBAL";
  }

  function metricAt(series, metric, idx) {
    if (metric === "confirmed") return series.confirmed[idx] || 0;
    if (metric === "deaths") return series.deaths[idx] || 0;
    if (metric === "observed") return series.observed?.[idx] || 0;
    return (series.confirmed[idx] || 0) + (series.probable[idx] || 0);
  }

  function continentSeries(metric) {
    const labels = data.series.dates;
    const buckets = {};

    data.continents
      .filter((item) => item.code !== "GLOBAL")
      .forEach((item) => {
        buckets[item.code] = labels.map(() => 0);
      });

    data.countries.forEach((country) => {
      const key = country.continentCode;
      const series = data.series.byCountry[country.code];
      if (!series || !buckets[key]) return;

      labels.forEach((_, idx) => {
        buckets[key][idx] += metricAt(series, metric, idx);
      });
    });

    return { labels, buckets };
  }

  function renderContinentChart() {
    const metric = document.getElementById("continentMetric").value;
    const scope = document.getElementById("continentScope").value;
    const built = continentSeries(metric);

    const keys = scope === "GLOBAL"
      ? Object.keys(built.buckets)
      : [scope];

    const datasets = keys.map((key) => ({
      label: continentNameByCode(key),
      data: built.buckets[key] || built.labels.map(() => 0),
      borderColor: continentPalette[key] || "#6b7280",
      backgroundColor: "transparent",
      borderWidth: 2.3,
      pointRadius: 3,
      pointHoverRadius: 6,
      tension: 0.2
    }));

    if (state.continentChart) state.continentChart.destroy();

    state.continentChart = new Chart(document.getElementById("continentChart"), {
      type: "line",
      data: {
        labels: built.labels,
        datasets
      },
      options: chartOptions()
    });
  }

  function syncMapHeightToDailyPanel() {
    const dailyPanel = document.querySelector(".daily-panel");
    const mapShell = document.querySelector(".map-shell");
    const mapNode = document.getElementById("map");
    if (!dailyPanel || !mapShell || !mapNode) return;

    const isDesktop = window.matchMedia("(min-width: 1241px)").matches;
    if (!isDesktop) {
      mapShell.style.height = "";
      mapShell.style.minHeight = "";
      mapNode.style.height = "";
      if (state.map) state.map.invalidateSize();
      return;
    }

    const panelHeight = Math.max(560, Math.ceil(dailyPanel.getBoundingClientRect().height));
    mapShell.style.height = `${panelHeight}px`;
    mapShell.style.minHeight = `${panelHeight}px`;

    const shellStyle = window.getComputedStyle(mapShell);
    const shellFrameHeight = ["paddingTop", "paddingBottom", "borderTopWidth", "borderBottomWidth"]
      .reduce((sum, key) => sum + (parseFloat(shellStyle[key]) || 0), 0);
    mapNode.style.height = `${Math.max(260, Math.round(panelHeight - shellFrameHeight))}px`;

    if (state.map) state.map.invalidateSize();
  }

  function scheduleMapHeightSync() {
    syncMapHeightToDailyPanel();
    if (state.layoutSyncRaf) cancelAnimationFrame(state.layoutSyncRaf);
    state.layoutSyncRaf = requestAnimationFrame(() => {
      syncMapHeightToDailyPanel();
      state.layoutSyncRaf = 0;
    });
  }

  function chartOptions() {
    const isNight = state.theme === "night";
    const tick = isNight ? "#c5bca8" : "#8f7f66";
    const grid = isNight ? "rgba(184, 174, 154, 0.2)" : "rgba(171, 150, 120, 0.18)";
    const legend = isNight ? "#f1ead9" : "#6a4f33";

    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: legend,
            boxWidth: 14
          }
        },
        tooltip: {
          backgroundColor: isNight ? "#16212d" : "#5a4733",
          titleColor: "#fff",
          bodyColor: "#f6f0e2"
        }
      },
      scales: {
        x: {
          ticks: { color: tick },
          grid: { color: grid }
        },
        y: {
          beginAtZero: true,
          ticks: { color: tick, precision: 0 },
          grid: { color: grid }
        }
      }
    };
  }

  function renderAll() {
    renderTopText();
    renderDailySummary();
    renderStats();
    renderCountryTable();
    renderTimeline();
    renderObservationRegions();
    renderNews();
    renderWatchlist();
    renderExternalBenchmarks();
    renderSources();
    buildTrendScopeOptions();
    buildContinentScopeOptions();
    renderTrendChart();
    renderContinentChart();
    applyMapTheme();
    ensureCountryChoropleth();
    scheduleMapHeightSync();
  }

  function applyLang(lang) {
    state.lang = lang;
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.body.setAttribute("data-lang", lang === "zh" ? "zh" : "en");
    document.getElementById("langZh").classList.toggle("active", lang === "zh");
    document.getElementById("langEn").classList.toggle("active", lang === "en");
    renderAll();
  }

  function toggleTheme() {
    state.theme = state.theme === "day" ? "night" : "day";
    document.body.setAttribute("data-theme", state.theme);
    renderAll();
  }

  function bindEvents() {
    document.getElementById("langZh").addEventListener("click", () => applyLang("zh"));
    document.getElementById("langEn").addEventListener("click", () => applyLang("en"));
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);

    document.getElementById("trendScope").addEventListener("change", renderTrendChart);
    document.getElementById("continentScope").addEventListener("change", renderContinentChart);
    document.getElementById("continentMetric").addEventListener("change", renderContinentChart);
    document.getElementById("obsCountry").addEventListener("change", (e) => {
      state.obsCountry = e.target.value || "ALL";
      renderObservationRegions();
    });
    document.getElementById("obsStatus").addEventListener("change", (e) => {
      state.obsStatus = e.target.value || "ALL";
      renderObservationRegions();
    });
    document.getElementById("newsMoreBtn").addEventListener("click", () => {
      const total = (data.news || []).length;
      if (state.newsLimit < total) {
        state.newsLimit = Math.min(state.newsLimit + state.newsStep, total);
      } else {
        state.newsLimit = state.newsStep;
      }
      renderNews();
    });

    window.addEventListener("resize", scheduleMapHeightSync);

    if (window.ResizeObserver) {
      const dailyPanel = document.querySelector(".daily-panel");
      if (dailyPanel) {
        state.dailyPanelObserver = new ResizeObserver(() => {
          scheduleMapHeightSync();
        });
        state.dailyPanelObserver.observe(dailyPanel);
      }
    }
  }

  function boot() {
    if (!safeDataCheck()) return;
    initMap();
    bindEvents();
    applyLang("zh");
  }

  boot();
</script>
</body>
</html>
