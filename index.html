<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>全球病毒追踪看板</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&display=swap");

  :root {
    --bg: #f4efe3;
    --surface: #fffdf6;
    --line: #d7cdb9;
    --text: #6a4f33;
    --muted: #8f7f66;
    --primary: #19c8b9;
    --danger: #e05a5a;
    --shadow: 0 10px 28px rgba(61, 52, 40, 0.11);
    --radius-lg: 22px;
    --radius-md: 16px;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 10% 10%, rgba(25, 200, 185, 0.12), transparent 35%),
      radial-gradient(circle at 92% 6%, rgba(224, 90, 90, 0.1), transparent 32%),
      var(--bg);
    color: var(--text);
    font-family: Nunito, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .page {
    max-width: 1760px;
    margin: 0 auto;
    padding: 16px;
  }

  .header {
    background: var(--surface);
    border: 2px solid color-mix(in srgb, var(--line) 82%, transparent);
    border-radius: var(--radius-lg);
    padding: 12px 14px;
    box-shadow: var(--shadow);
    margin-bottom: 12px;
  }

  .title {
    margin: 0;
    font-size: clamp(1.15rem, 2vw, 1.7rem);
    font-weight: 800;
    letter-spacing: 0.2px;
  }

  .subtitle {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .tabs {
    margin-top: 10px;
    display: inline-flex;
    gap: 6px;
    padding: 5px;
    border-radius: 999px;
    border: 2px solid color-mix(in srgb, var(--line) 84%, transparent);
    background: color-mix(in srgb, var(--surface) 93%, #fff 7%);
  }

  .tab-btn {
    border: 0;
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.88rem;
    font-weight: 800;
    color: var(--muted);
    background: transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .tab-btn.active {
    color: #fff;
    background: var(--primary);
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.12);
  }

  .tab-btn[data-target="ebola"].active {
    background: var(--danger);
  }

  .switch-row {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .selector-label {
    font-size: 0.84rem;
    font-weight: 800;
    color: var(--muted);
  }

  .selector {
    border: 2px solid color-mix(in srgb, var(--line) 84%, transparent);
    border-radius: 12px;
    background: color-mix(in srgb, var(--surface) 94%, #fff 6%);
    color: var(--text);
    padding: 7px 10px;
    font-size: 0.86rem;
    font-weight: 700;
    min-width: 170px;
  }

  .panel-wrap {
    border: 2px solid color-mix(in srgb, var(--line) 82%, transparent);
    border-radius: var(--radius-lg);
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .tab-panel {
    display: none;
    width: 100%;
    height: calc(100vh - 190px);
    min-height: 760px;
  }

  .tab-panel.active {
    display: block;
  }

  .tab-panel iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    background: transparent;
  }

  @media (max-width: 980px) {
    .tab-panel {
      height: calc(100vh - 210px);
      min-height: 640px;
    }
  }
</style>
</head>
<body>
  <div class="page">
    <section class="header">
      <h1 class="title">全球病毒追踪看板</h1>
      <p class="subtitle">双标签模式：汉坦病毒（现有） + 埃博拉病毒（新增）</p>
      <div class="switch-row">
        <div class="tabs" role="tablist" aria-label="Outbreak tabs">
          <button class="tab-btn active" id="tab-hantavirus" role="tab" aria-selected="true" aria-controls="panel-hantavirus" data-target="hantavirus" type="button">汉坦病毒</button>
          <button class="tab-btn" id="tab-ebola" role="tab" aria-selected="false" aria-controls="panel-ebola" data-target="ebola" type="button">埃博拉病毒</button>
        </div>
        <label class="selector-label" for="virusSelector">病毒筛选</label>
        <select class="selector" id="virusSelector" aria-label="病毒筛选">
          <option value="hantavirus">汉坦病毒</option>
          <option value="ebola">埃博拉病毒</option>
        </select>
      </div>
    </section>

    <section class="panel-wrap">
      <div class="tab-panel active" id="panel-hantavirus" role="tabpanel" aria-labelledby="tab-hantavirus">
        <iframe src="./hantavirus-outbreak-tracker-v2.html" title="汉坦病毒追踪"></iframe>
      </div>
      <div class="tab-panel" id="panel-ebola" role="tabpanel" aria-labelledby="tab-ebola">
        <iframe src="./ebola-tracker.html" title="埃博拉病毒追踪"></iframe>
      </div>
    </section>
  </div>

<script>
  const TAB_KEY = "outbreakTab";

  function activateTab(target) {
    const tab = target === "ebola" ? "ebola" : "hantavirus";

    document.querySelectorAll(".tab-btn").forEach((btn) => {
      const active = btn.dataset.target === tab;
      btn.classList.toggle("active", active);
      btn.setAttribute("aria-selected", active ? "true" : "false");
    });

    document.querySelectorAll(".tab-panel").forEach((panel) => {
      const active = panel.id === `panel-${tab}`;
      panel.classList.toggle("active", active);
    });

    const selector = document.getElementById("virusSelector");
    if (selector && selector.value !== tab) {
      selector.value = tab;
    }

    const params = new URLSearchParams(window.location.search);
    params.set("tab", tab);
    const next = `${window.location.pathname}?${params.toString()}`;
    window.history.replaceState({}, "", next);

    try {
      localStorage.setItem(TAB_KEY, tab);
    } catch (_) {}
  }

  function initTabState() {
    const params = new URLSearchParams(window.location.search);
    const byQuery = params.get("tab");
    let remembered = null;
    try {
      remembered = localStorage.getItem(TAB_KEY);
    } catch (_) {}

    activateTab(byQuery || remembered || "hantavirus");
  }

  document.querySelectorAll(".tab-btn").forEach((btn) => {
    btn.addEventListener("click", () => activateTab(btn.dataset.target));
  });

  document.getElementById("virusSelector").addEventListener("change", (e) => {
    activateTab(e.target.value);
  });

  initTabState();
</script>
</body>
</html>
