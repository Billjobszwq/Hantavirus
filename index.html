<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>汉坦病毒（安第斯病毒）全球确诊追踪</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f7ff;
    --bg-accent-1: rgba(211, 47, 47, 0.12);
    --bg-accent-2: rgba(255, 111, 0, 0.09);
    --surface: #ffffff;
    --surface-alt: #fff7f2;
    --line: #d7e0f2;
    --text: #151f32;
    --muted: #5f6d8f;
    --primary: #1f4ed8;
    --danger: #d92d20;
    --warning: #f97316;
    --ok: #198754;
    --glow: 0 0 0 2px rgba(217, 45, 32, 0.14);
    --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
  }

  body[data-theme="night"] {
    --bg: #0d1323;
    --bg-accent-1: rgba(239, 68, 68, 0.14);
    --bg-accent-2: rgba(249, 115, 22, 0.1);
    --surface: #141d31;
    --surface-alt: #17233b;
    --line: #2b3a58;
    --text: #e6ecff;
    --muted: #9fb1d8;
    --primary: #7aa2ff;
    --danger: #ff6b6b;
    --warning: #ff9b52;
    --ok: #52d28a;
    --glow: 0 0 0 2px rgba(255, 107, 107, 0.22);
    --shadow: 0 14px 30px rgba(0, 0, 0, 0.28);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background:
      radial-gradient(circle at 10% 10%, var(--bg-accent-1), transparent 34%),
      radial-gradient(circle at 92% 4%, var(--bg-accent-2), transparent 30%),
      var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    line-height: 1.5;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .page {
    max-width: 1580px;
    margin: 0 auto;
    padding: 20px 16px 30px;
  }

  .topbar {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }

  .title-wrap h1 {
    margin: 0;
    font-size: clamp(1.3rem, 2.5vw, 2rem);
    letter-spacing: 0.2px;
  }

  .title-wrap p {
    margin: 5px 0 0;
    font-size: 0.95rem;
    color: var(--muted);
  }

  .top-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .segmented {
    display: inline-flex;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    background: var(--surface);
    box-shadow: var(--shadow);
  }

  .segmented button {
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.84rem;
    cursor: pointer;
  }

  .segmented button.active {
    background: var(--primary);
    color: #fff;
  }

  .mode-btn {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 12px;
    font-size: 0.83rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: var(--shadow);
  }

  .meta-bar {
    display: grid;
    grid-template-columns: repeat(2, minmax(260px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }

  .meta-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 13px;
    color: var(--muted);
    font-size: 0.86rem;
    box-shadow: var(--shadow);
  }

  .map-daily-row {
    display: grid;
    grid-template-columns: minmax(220px, 20%) minmax(0, 80%);
    gap: 10px;
    padding: 10px;
    align-items: stretch;
  }

  .daily-panel {
    background:
      linear-gradient(180deg, rgba(217, 45, 32, 0.08) 0%, rgba(249, 115, 22, 0.08) 28%, var(--surface-alt) 28%, var(--surface) 100%);
    color: var(--text);
    border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--danger) 28%, var(--line) 72%);
    padding: 12px;
    box-shadow: var(--shadow);
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }

  body[data-theme="night"] .daily-panel {
    background:
      linear-gradient(180deg, rgba(255, 107, 107, 0.12) 0%, rgba(255, 155, 82, 0.12) 28%, var(--surface-alt) 28%, var(--surface) 100%);
    border-color: color-mix(in srgb, var(--danger) 34%, var(--line) 66%);
  }

  .daily-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }

  .map-shell {
    border: 1px solid color-mix(in srgb, var(--line) 70%, transparent);
    border-radius: 12px;
    padding: 2px;
    background: color-mix(in srgb, var(--surface) 90%, #edf2ff 10%);
    min-height: 560px;
  }

  body[data-theme="night"] .map-shell {
    background: color-mix(in srgb, var(--surface) 88%, #22375f 12%);
  }

  .daily-title {
    font-size: 0.95rem;
    font-weight: 800;
    margin: 0;
    color: color-mix(in srgb, var(--text) 86%, var(--danger) 14%);
  }

  .daily-chip {
    font-size: 0.71rem;
    font-weight: 800;
    letter-spacing: 0.15px;
    color: color-mix(in srgb, var(--danger) 74%, #fff 26%);
    background: color-mix(in srgb, var(--danger) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--danger) 28%, transparent);
    border-radius: 999px;
    padding: 3px 9px;
    white-space: nowrap;
  }

  .daily-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(120px, 1fr));
    gap: 7px;
  }

  .daily-cell {
    background: color-mix(in srgb, var(--surface) 90%, #fff 10%);
    border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
    border-top: 2px solid color-mix(in srgb, var(--danger) 42%, transparent);
    border-radius: 10px;
    padding: 8px 8px 7px;
  }

  .daily-label {
    font-size: 0.72rem;
    color: var(--muted);
  }

  .daily-value {
    font-size: 1.02rem;
    font-weight: 800;
    margin-top: 2px;
    color: color-mix(in srgb, var(--text) 84%, var(--danger) 16%);
  }

  .daily-health {
    margin-top: 9px;
    border: 1px solid color-mix(in srgb, var(--line) 78%, transparent);
    border-radius: 10px;
    background: color-mix(in srgb, var(--surface) 93%, #fff 7%);
    padding: 9px 9px 8px;
    overflow: auto;
    flex: 1;
    min-height: 0;
  }

  .daily-health-title {
    font-size: 0.79rem;
    font-weight: 800;
    color: color-mix(in srgb, var(--text) 78%, var(--danger) 22%);
    margin-bottom: 7px;
  }

  .daily-health-list {
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 6px;
  }

  .daily-health-item {
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 7px;
    align-items: start;
    font-size: 0.74rem;
    line-height: 1.36;
    color: color-mix(in srgb, var(--text) 82%, var(--muted) 18%);
  }

  .daily-health-item .k {
    color: color-mix(in srgb, var(--danger) 78%, var(--text) 22%);
    font-weight: 800;
    white-space: nowrap;
  }

  .daily-health-item .v {
    word-break: break-word;
  }

  .daily-health-source {
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px dashed color-mix(in srgb, var(--line) 78%, transparent);
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.32;
  }

  .daily-health-source a {
    color: var(--primary);
    text-decoration: none;
  }

  .daily-health-source a:hover {
    text-decoration: underline;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(6, minmax(120px, 1fr));
    gap: 10px;
    margin-bottom: 10px;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px;
    box-shadow: var(--shadow);
  }

  .stat .label {
    font-size: 0.76rem;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat .value {
    font-size: clamp(1.15rem, 2vw, 1.65rem);
    font-weight: 800;
    line-height: 1;
  }

  .stat.primary .value { color: var(--primary); }
  .stat.ok .value { color: var(--ok); }
  .stat.warning .value { color: var(--warning); }
  .stat.danger .value { color: var(--danger); }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }

  .card + .card {
    margin-top: 10px;
  }

  .card-header {
    padding: 11px 13px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(240, 245, 255, 0.85) 0%, rgba(248, 251, 255, 0.7) 100%);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
  }

  body[data-theme="night"] .card-header {
    background: linear-gradient(180deg, rgba(37, 54, 92, 0.8) 0%, rgba(25, 38, 64, 0.7) 100%);
  }

  .card-title {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 800;
  }

  .card-subtitle {
    margin: 1px 0 0;
    font-size: 0.77rem;
    color: var(--muted);
  }

  .main-grid { margin-bottom: 10px; }

  .tables-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 10px;
    align-items: stretch;
  }

  .tables-grid > .card {
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }

  .tables-grid > .card + .card {
    margin-top: 0;
  }

  .tables-grid > .card .table-scroll {
    flex: 1;
    max-height: none;
  }

  #map {
    height: 556px;
    width: 100%;
    border-radius: 10px;
  }

  .table-scroll {
    max-height: 540px;
    overflow: auto;
    scrollbar-gutter: stable both-edges;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84rem;
    font-variant-numeric: lining-nums tabular-nums;
  }

  th,
  td {
    padding: 9px 8px;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 75%, transparent);
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }

  th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: color-mix(in srgb, var(--surface) 84%, #eaf0ff 16%);
    color: color-mix(in srgb, var(--muted) 76%, var(--text) 24%);
    font-size: 0.76rem;
    text-transform: none;
    letter-spacing: 0.12px;
    font-weight: 700;
    white-space: nowrap;
  }

  tbody tr:hover td {
    background: color-mix(in srgb, var(--surface) 88%, #eef4ff 12%);
  }

  tbody tr:nth-child(even) td {
    background: color-mix(in srgb, var(--surface) 92%, #f0f5ff 8%);
  }

  .country-cell {
    font-weight: 700;
    white-space: nowrap;
  }

  .country-flag {
    font-size: 1rem;
    margin-right: 4px;
  }

  .num {
    text-align: right;
    white-space: nowrap;
  }

  .table-scroll table {
    width: max-content;
    min-width: 100%;
  }

  .country-table,
  .timeline-table {
    table-layout: auto;
  }

  .country-table {
    min-width: 1320px;
  }

  .timeline-table {
    min-width: 1440px;
  }

  .country-table th:nth-child(1),
  .country-table td:nth-child(1) { width: 150px; }
  .country-table th:nth-child(2),
  .country-table td:nth-child(2) { width: 100px; }
  .country-table th:nth-child(3),
  .country-table td:nth-child(3) { width: 74px; }
  .country-table th:nth-child(4),
  .country-table td:nth-child(4) { width: 74px; }
  .country-table th:nth-child(5),
  .country-table td:nth-child(5) { width: 80px; }
  .country-table th:nth-child(6),
  .country-table td:nth-child(6) { width: 74px; }
  .country-table th:nth-child(7),
  .country-table td:nth-child(7) { width: 116px; }
  .country-table th:nth-child(8),
  .country-table td:nth-child(8) { width: 620px; }

  .timeline-table th:nth-child(1),
  .timeline-table td:nth-child(1) { width: 108px; }
  .timeline-table th:nth-child(2),
  .timeline-table td:nth-child(2) { width: 112px; }
  .timeline-table th:nth-child(3),
  .timeline-table td:nth-child(3) { width: 74px; }
  .timeline-table th:nth-child(4),
  .timeline-table td:nth-child(4) { width: 74px; }
  .timeline-table th:nth-child(5),
  .timeline-table td:nth-child(5) { width: 880px; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 700;
  }

  .badge-confirmed {
    background: color-mix(in srgb, var(--primary) 16%, transparent);
    color: var(--primary);
  }

  .badge-death {
    background: color-mix(in srgb, var(--danger) 16%, transparent);
    color: var(--danger);
  }

  .country-notes,
  .timeline-event {
    color: color-mix(in srgb, var(--text) 70%, var(--muted) 30%);
    line-height: 1.45;
    white-space: nowrap;
  }

  .dot-legend {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 0.76rem;
  }

  .dot-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  .dot.blue { background: var(--primary); }
  .dot.orange { background: var(--warning); }
  .dot.red { background: var(--danger); }

  .control-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .control-row label {
    font-size: 0.76rem;
    color: var(--muted);
    font-weight: 700;
  }

  .control-row select {
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 0.82rem;
    box-shadow: inset 0 0 0 1px transparent;
  }

  .control-row select:focus {
    outline: none;
    box-shadow: var(--glow);
  }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .charts-grid > .card {
    min-height: 446px;
    display: flex;
    flex-direction: column;
  }

  .charts-grid > .card + .card {
    margin-top: 0;
  }

  .chart-wrap {
    height: 360px;
    min-height: 360px;
    flex: 1;
    padding: 8px 12px 12px;
  }

  .news-list,
  .source-list,
  .watch-list {
    margin: 0;
    padding: 10px 14px 14px;
    list-style: none;
  }

  .news-item,
  .watch-item {
    padding: 9px 0;
    border-bottom: 1px solid color-mix(in srgb, var(--line) 72%, transparent);
  }

  .news-item:last-child,
  .watch-item:last-child {
    border-bottom: 0;
  }

  .news-date {
    color: var(--primary);
    font-size: 0.74rem;
    font-weight: 800;
  }

  .news-title,
  .watch-title {
    margin: 4px 0;
    font-size: 0.9rem;
    font-weight: 700;
  }

  .news-summary,
  .watch-note {
    margin: 0;
    color: color-mix(in srgb, var(--text) 72%, var(--muted) 28%);
    font-size: 0.84rem;
  }

  .news-source,
  .watch-source {
    margin-top: 5px;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .news-source a,
  .source-list a,
  .watch-source a {
    color: var(--primary);
    text-decoration: none;
  }

  .news-source a:hover,
  .source-list a:hover,
  .watch-source a:hover {
    text-decoration: underline;
  }

  .news-scroll {
    max-height: min(62vh, 620px);
    overflow: auto;
  }

  .watch-scroll {
    max-height: 220px;
    overflow: auto;
  }

  .list-actions {
    display: flex;
    justify-content: center;
    padding: 0 14px 14px;
  }

  .ghost-btn {
    border: 1px solid var(--line);
    background: color-mix(in srgb, var(--surface) 82%, #eaf1ff 18%);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  .ghost-btn:hover {
    border-color: color-mix(in srgb, var(--primary) 45%, var(--line) 55%);
    color: var(--primary);
  }

  .ghost-btn:disabled {
    opacity: 0.55;
    cursor: default;
  }

  body[data-lang="en"] .country-table,
  body[data-lang="en"] .timeline-table {
    font-size: 0.82rem;
  }

  body[data-lang="en"] .country-table th,
  body[data-lang="en"] .timeline-table th {
    letter-spacing: 0.08px;
  }

  body[data-lang="en"] .country-notes,
  body[data-lang="en"] .timeline-event {
    font-size: 0.79rem;
    line-height: 1.52;
    hyphens: auto;
  }

  .source-list li {
    margin-bottom: 8px;
    font-size: 0.85rem;
    color: color-mix(in srgb, var(--text) 80%, var(--muted) 20%);
  }

  .leaflet-popup-content {
    margin: 10px 12px;
    font-size: 0.84rem;
  }

  @media (max-width: 1240px) {
    .stats {
      grid-template-columns: repeat(3, minmax(120px, 1fr));
    }

    .main-grid,
    .charts-grid,
    .tables-grid,
    .map-daily-row {
      grid-template-columns: 1fr;
    }

    #map,
    .map-shell,
    .table-scroll {
      height: 430px;
      max-height: 430px;
    }
    .map-shell {
      min-height: 430px;
    }
    .daily-panel {
      min-height: 430px;
    }
  }

  @media (max-width: 760px) {
    .meta-bar {
      grid-template-columns: 1fr;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(120px, 1fr));
    }

    th,
    td {
      padding: 8px 6px;
      font-size: 0.8rem;
    }

    .chart-wrap {
      height: 320px;
    }
  }
</style>
</head>
<body data-theme="day">
  <div class="page">
    <div class="topbar">
      <div class="title-wrap">
        <h1 id="pageTitle"></h1>
        <p id="pageSubtitle"></p>
      </div>
      <div class="top-controls">
        <div class="segmented" role="group" aria-label="Language switch">
          <button class="active" id="langZh" type="button">中文</button>
          <button id="langEn" type="button">English</button>
        </div>
        <button class="mode-btn" id="themeToggle" type="button"></button>
      </div>
    </div>

    <div class="meta-bar">
      <div class="meta-card" id="metaUpdate"></div>
      <div class="meta-card" id="metaScope"></div>
    </div>

    <div class="stats" id="statsRow"></div>

    <div class="main-grid">
      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title" id="mapTitle"></h2>
            <p class="card-subtitle" id="mapSubtitle"></p>
          </div>
          <div class="dot-legend" id="mapLegend"></div>
        </div>
        <div class="map-daily-row">
          <aside class="daily-panel">
            <div class="daily-head">
              <div class="daily-title" id="dailyTitle"></div>
              <div class="daily-chip" id="dailyChip"></div>
            </div>
            <div class="daily-grid" id="dailyGrid"></div>
            <div class="daily-health">
              <div class="daily-health-title" id="dailyHealthTitle"></div>
              <ul class="daily-health-list" id="dailyHealthList"></ul>
              <div class="daily-health-source" id="dailyHealthSource"></div>
            </div>
          </aside>
          <div class="map-shell">
            <div id="map"></div>
          </div>
        </div>
      </section>
    </div>

    <div class="tables-grid">
      <section class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title" id="countryTitle"></h2>
            <p class="card-subtitle" id="countrySubtitle"></p>
          </div>
        </div>
        <div class="table-scroll">
          <table class="country-table">
            <thead>
              <tr>
                <th id="cthCountry"></th>
                <th id="cthContinent"></th>
                <th id="cthConfirmed" class="num"></th>
                <th id="cthProbable" class="num"></th>
                <th id="cthTotal" class="num"></th>
                <th id="cthDeaths" class="num"></th>
                <th id="cthLastUpdate"></th>
                <th id="cthNotes"></th>
              </tr>
            </thead>
            <tbody id="countryBody"></tbody>
          </table>
        </div>
      </section>

      <section class="card">
        <div class="card-header">

  function safeDataCheck() {
    if (!data || !Array.isArray(data.countries) || !Array.isArray(data.timeline) || !data.series) {
      document.body.innerHTML = "<div style='padding:24px;font-family:sans-serif'>Data missing: check outbreak-data.js</div>";
      return false;
    }
    return true;
  }

  function t() {
    return i18n[state.lang];
  }

  function findSourceById(id) {
    return data.sources.find((item) => item.id === id) || null;
  }

  function countryName(c) {
    return state.lang === "zh" ? c.countryZh : c.countryEn;
  }

  function continentNameByCode(code) {
    const match = data.continents.find((item) => item.code === code);
    if (!match) return code;
    return state.lang === "zh" ? match.zh : match.en;
  }

  function fmtNumber(v) {
    return Number.isFinite(v) ? v : 0;
  }

  function buildConfirmedSeries(confirmed, confirmedDeaths, labels) {
    const safeConfirmed = labels.map((_, i) => fmtNumber(confirmed?.[i]));
    const safeDeaths = labels.map((_, i) => {
      const deathsVal = fmtNumber(confirmedDeaths?.[i]);
      return Math.min(deathsVal, safeConfirmed[i]);
    });
    return { safeConfirmed, safeDeaths };
  }

  function renderDailySummary() {
    const lang = t();
    const sorted = [...data.timeline].sort((a, b) => new Date(b.date) - new Date(a.date));
    const latestDate = sorted.length ? sorted[0].date : data.meta.lastUpdatedDate;
    const sameDay = sorted.filter((item) => item.date === latestDate);

    const confirmedAdd = sameDay.reduce((sum, item) => sum + (item.confirmedDelta || 0), 0);
    const deathsAdd = sameDay.reduce((sum, item) => sum + (item.deathsDelta || 0), 0);

    const countriesSet = new Set(
      sameDay
        .map((item) => (state.lang === "zh" ? item.countryZh : item.countryEn))
        .filter((name) => name && !name.includes("WHO"))
    );

    document.getElementById("dailyTitle").textContent = lang.dailyTitle;
    document.getElementById("dailyChip").textContent = lang.dailyChip;

    const rows = [
      { k: lang.dailyFields.date, v: latestDate },
      { k: lang.dailyFields.confirmed, v: confirmedAdd },
      { k: lang.dailyFields.deaths, v: deathsAdd },
      { k: lang.dailyFields.countries, v: countriesSet.size }
    ];

    document.getElementById("dailyGrid").innerHTML = rows.map((item) => `
      <div class="daily-cell">
        <div class="daily-label">${item.k}</div>
        <div class="daily-value">${item.v}</div>
      </div>
    `).join("");

    document.getElementById("dailyHealthTitle").textContent = lang.dailyHealthTitle;
    document.getElementById("dailyHealthList").innerHTML = (lang.dailyHealthItems || []).map((item) => `
      <li class="daily-health-item">
        <span class="k">${item.k}</span>
        <span class="v">${item.v}</span>
      </li>
    `).join("");

    const sourceLinks = (lang.dailyHealthSources || []).map((item) => `
      <a href="${item.url}" target="_blank" rel="noopener noreferrer">${item.label}</a>
    `).join(" · ");
    document.getElementById("dailyHealthSource").innerHTML = `${lang.dailyHealthSourcesPrefix}${sourceLinks}`;
  }

  function renderStats() {
    const lang = t();
    const row = document.getElementById("statsRow");
    row.innerHTML = "";

    lang.stats.forEach((item) => {
      const value = data.summary[item.key] ?? 0;
      row.innerHTML += `
        <div class="stat ${item.style}">
          <div class="label">${item.label}</div>
          <div class="value">${value}</div>
        </div>
      `;
    });
  }

  function renderCountryTable() {
    const body = document.getElementById("countryBody");
    body.innerHTML = "";

    const sorted = [...data.countries].sort((a, b) => {
      const scoreA = (a.confirmed + a.probable) * 100 + a.deaths;
      const scoreB = (b.confirmed + b.probable) * 100 + b.deaths;
      return scoreB - scoreA;
    });

    sorted.forEach((country) => {
      const total = country.confirmed + country.probable;
      const continent = state.lang === "zh" ? country.continentZh : country.continentEn;

      body.innerHTML += `
        <tr>
          <td class="country-cell"><span class="country-flag">${country.flag || "🌐"}</span>${countryName(country)}</td>
          <td>${continent}</td>
          <td class="num">${fmtNumber(country.confirmed)}</td>
          <td class="num">${fmtNumber(country.probable)}</td>
          <td class="num">${fmtNumber(total)}</td>
          <td class="num">${fmtNumber(country.deaths)}</td>
          <td>${country.lastUpdate}</td>
          <td class="country-notes">${country.notes[state.lang]}</td>
        </tr>
      `;
    });
  }

  function renderTimeline() {
    const body = document.getElementById("timelineBody");
    body.innerHTML = "";

    const sorted = [...data.timeline].sort((a, b) => {
      if (a.date === b.date) {
        return (b.confirmedDelta + b.deathsDelta) - (a.confirmedDelta + a.deathsDelta);
      }
      return new Date(b.date) - new Date(a.date);
    });

    sorted.forEach((item) => {
      const country = state.lang === "zh" ? item.countryZh : item.countryEn;
      body.innerHTML += `
        <tr>
          <td>${item.date}</td>
          <td>${country}</td>
          <td class="num">${item.confirmedDelta > 0 ? `<span class="badge badge-confirmed">+${item.confirmedDelta}</span>` : "0"}</td>
          <td class="num">${item.deathsDelta > 0 ? `<span class="badge badge-death">+${item.deathsDelta}</span>` : "0"}</td>
          <td class="timeline-event">${item.description[state.lang]}</td>
        </tr>
      `;
    });
  }

  function renderNews() {
    const lang = t();
    const list = document.getElementById("newsList");
    const btn = document.getElementById("newsMoreBtn");
    list.innerHTML = "";

    const sorted = [...(data.news || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
    const visible = sorted.slice(0, state.newsLimit);

    visible.forEach((item) => {
      const source = findSourceById(item.sourceId);
      const sourceText = source
        ? `<a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.publisher}</a>`
        : lang.noSource;

      list.innerHTML += `
        <li class="news-item">
          <div class="news-date">${item.date}</div>
          <div class="news-title">${item.title[state.lang]}</div>
          <p class="news-summary">${item.summary[state.lang]}</p>
          <div class="news-source">${lang.sourceLabel}: ${sourceText}</div>
        </li>
      `;
    });

    if (!btn) return;
    const hasMore = state.newsLimit < sorted.length;
    btn.textContent = hasMore ? `${lang.newsMore} (${sorted.length - state.newsLimit})` : lang.newsCollapse;
    btn.disabled = sorted.length <= state.newsStep;
    btn.style.display = sorted.length > state.newsStep ? "inline-flex" : "none";
  }

  function renderWatchlist() {
    const lang = t();
    const list = document.getElementById("watchList");
    list.innerHTML = "";

    const sorted = [...(data.watchlist || [])].sort((a, b) => new Date(b.date) - new Date(a.date));
    sorted.forEach((item) => {
      const sourceLinks = (item.sourceIds || []).map((id) => {
        const source = findSourceById(id);
        if (!source) return null;
        return `<a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.publisher}</a>`;
      }).filter(Boolean);

      list.innerHTML += `
        <li class="watch-item">
          <div class="news-date">${item.date}</div>
          <div class="watch-title">${item.title[state.lang]}</div>
          <p class="watch-note">${item.note[state.lang]}</p>
          <div class="watch-source">${lang.sourceLabel}: ${sourceLinks.length ? sourceLinks.join(" / ") : lang.noSource}</div>
        </li>
      `;
    });
  }

  function renderSources() {
    const list = document.getElementById("sourceList");
    list.innerHTML = "";

    [...(data.sources || [])]
      .sort((a, b) => new Date(b.date) - new Date(a.date))
      .forEach((source) => {
        list.innerHTML += `<li><strong>${source.publisher}</strong> · ${source.date} · <a href="${source.url}" target="_blank" rel="noopener noreferrer">${source.title}</a></li>`;
      });
  }

  function countryStatus(country) {
    if (!country) return "none";
    if ((country.deaths || 0) > 0) return "death";
    if ((country.probable || 0) > 0) return "probable";
    if ((country.confirmed || 0) > 0) return "confirmed";
    return "none";
  }

  function mapPalette() {
    if (state.theme === "night") {
      return {
        none: { fillColor: "#1e2a42", borderColor: "#2f4165", fillOpacity: 0.18, weight: 0.6 },
        confirmed: { fillColor: "#4f7dff", borderColor: "#c7d8ff", fillOpacity: 0.6, weight: 0.95 },
        probable: { fillColor: "#ff9b52", borderColor: "#ffd8bb", fillOpacity: 0.66, weight: 1.05 },
        death: { fillColor: "#ff6b6b", borderColor: "#ffd0d0", fillOpacity: 0.72, weight: 1.12 }
      };
    }

    return {
      none: { fillColor: "#dbe5f5", borderColor: "#c7d3e8", fillOpacity: 0.28, weight: 0.65 },
      confirmed: { fillColor: "#1f4ed8", borderColor: "#ffffff", fillOpacity: 0.58, weight: 0.95 },
      probable: { fillColor: "#f97316", borderColor: "#ffffff", fillOpacity: 0.62, weight: 1.05 },
      death: { fillColor: "#d92d20", borderColor: "#ffffff", fillOpacity: 0.7, weight: 1.12 }
    };
  }

  function featureCountryCode(feature) {
    const rawCode = feature?.properties?.iso_a2 || feature?.properties?.["ISO3166-1-Alpha-2"] || "";
    return typeof rawCode === "string" ? rawCode.toUpperCase() : "";
  }

  function countryGeoPopup(country, fallbackName) {
    if (!country) {
      const unknownLabel = state.lang === "zh" ? "无病例通报" : "No reported cases";
      const unknownText = state.lang === "zh" ? "当前数据集中该国家暂无病例记录。" : "No case record for this country in the current dataset.";
      return `<strong>${fallbackName}</strong><br>${unknownLabel}<br><div style="margin-top:6px;color:#5f6d8f;">${unknownText}</div>`;
    }

    return `
      <strong>${country.flag || "🌐"} ${countryName(country)}</strong><br>
      ${state.lang === "zh" ? "大洲" : "Continent"}: ${state.lang === "zh" ? country.continentZh : country.continentEn}<br>
      ${state.lang === "zh" ? "确诊" : "Confirmed"}: ${country.confirmed}<br>
      ${state.lang === "zh" ? "可能" : "Probable"}: ${country.probable}<br>
      ${state.lang === "zh" ? "死亡" : "Deaths"}: ${country.deaths}<br>
      ${state.lang === "zh" ? "最后更新" : "Last update"}: ${country.lastUpdate}<br>
      <div style="margin-top:6px;color:#5f6d8f;">${country.notes[state.lang]}</div>
    `;
  }

  function countryGeoStyle(feature) {
    const code = featureCountryCode(feature);
    const country = countryLookup[code] || null;
    const palette = mapPalette();
    const swatch = palette[countryStatus(country)] || palette.none;
    return {
      color: swatch.borderColor,
      weight: swatch.weight,
      fillColor: swatch.fillColor,
      fillOpacity: swatch.fillOpacity
    };
  }

  function bindCountryGeoEvents(feature, layer) {
    layer.on({
      mouseover: (e) => {
        const base = countryGeoStyle(e.target.feature);
        e.target.setStyle({
          ...base,
          weight: (base.weight || 1) + 0.8,
          fillOpacity: Math.min((base.fillOpacity || 0.4) + 0.12, 0.86)
        });
        if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
          e.target.bringToFront();
        }
      },
      mouseout: (e) => {
        if (state.countryGeoLayer) state.countryGeoLayer.resetStyle(e.target);
      },
      click: (e) => {
        const feature = e.target.feature;
        const code = featureCountryCode(feature);
        const country = countryLookup[code] || null;
        const fallbackName = feature?.properties?.name || feature?.properties?.admin || code || (state.lang === "zh" ? "未知国家" : "Unknown country");
        e.target.bindPopup(countryGeoPopup(country, fallbackName)).openPopup();
      }
    });
  }

  function markerColor(country) {
    if (country.deaths > 0) return "#d92d20";
    if (country.probable > 0) return "#f97316";
    return "#1f4ed8";
  }

  function markerRadius(country) {
    const total = country.confirmed + country.probable;
    return 5 + Math.min(total * 2.4, 12);
  }

  function clearMarkers() {
    state.markers.forEach((m) => m.remove());
    state.markers = [];
  }

  function drawMarkersFallback() {
    if (!state.map) return;
    clearMarkers();

    data.countries.forEach((country) => {
      const marker = L.circleMarker([country.lat, country.lng], {
        radius: markerRadius(country),
        color: "#ffffff",
        weight: 1.5,
        fillColor: markerColor(country),
        fillOpacity: 0.9
      }).addTo(state.map);

      marker.bindPopup(countryGeoPopup(country, countryName(country)));
      state.markers.push(marker);
    });
  }

  function applyChoroplethTheme() {
    if (!state.countryGeoLayer) return;
    state.countryGeoLayer.setStyle((feature) => countryGeoStyle(feature));
  }

  async function ensureCountryChoropleth() {
    if (!state.map) return;

    try {
      if (!state.countryGeoData) {
        const res = await fetch(COUNTRY_GEOJSON_URL, { cache: "force-cache" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        state.countryGeoData = await res.json();
      }

      clearMarkers();

      if (!state.countryGeoLayer) {
        state.countryGeoLayer = L.geoJSON(state.countryGeoData, {
          style: (feature) => countryGeoStyle(feature),
          onEachFeature: bindCountryGeoEvents
        }).addTo(state.map);
      } else {
        applyChoroplethTheme();
      }
    } catch (err) {
      console.warn("Country choropleth loading failed, fallback to markers.", err);
      if (state.countryGeoLayer && state.map.hasLayer(state.countryGeoLayer)) {
        state.map.removeLayer(state.countryGeoLayer);
      }
      state.countryGeoLayer = null;
      drawMarkersFallback();
    }
  }

  function initMap() {
    state.map = L.map("map", {
      zoomControl: true,
      minZoom: 2,
      maxZoom: 6
    }).setView([23, 10], 2);

    state.mapBaseLayers = {
      light: L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }),
      dark: L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      })
    };

    applyMapTheme();
    ensureCountryChoropleth();
  }

  function applyMapTheme() {
    if (!state.map || !state.mapBaseLayers) return;

    const target = state.theme === "night" ? "dark" : "light";
    if (state.activeBaseKey === target) {
      applyChoroplethTheme();
      return;
    }

    if (state.activeBaseLayer && state.map.hasLayer(state.activeBaseLayer)) {
      state.map.removeLayer(state.activeBaseLayer);
    }

    const nextLayer = state.mapBaseLayers[target];
    nextLayer.addTo(state.map);
    state.activeBaseLayer = nextLayer;
    state.activeBaseKey = target;
    applyChoroplethTheme();
  }

  function buildTrendScopeOptions() {
    const lang = t();
    const select = document.getElementById("trendScope");
    const current = select.value || "GLOBAL";

    const options = [{ value: "GLOBAL", label: lang.global }]
      .concat(
        [...data.countries]
          .sort((a, b) => countryName(a).localeCompare(countryName(b)))
          .map((country) => ({ value: country.code, label: `${country.flag || "🌐"} ${countryName(country)}` }))
      );

    select.innerHTML = options.map((opt) => `<option value="${opt.value}">${opt.label}</option>`).join("");
    select.value = options.some((opt) => opt.value === current) ? current : "GLOBAL";
  }

  function trendData(scope) {
    const labels = data.series.dates;

    if (scope === "GLOBAL") {
      const normalized = buildConfirmedSeries(
        data.series.global.confirmed,
        data.series.global.confirmedDeaths,
        labels
      );
      return {
        labels,
        confirmed: normalized.safeConfirmed,
        deathsConfirmed: normalized.safeDeaths
      };
    }

    const series = data.series.byCountry[scope];
    if (!series) {
      return {
        labels,
        confirmed: labels.map(() => 0),
        deathsConfirmed: labels.map(() => 0)
      };
    }

    const normalized = buildConfirmedSeries(series.confirmed, series.confirmedDeaths, labels);
    return {
      labels,
      confirmed: normalized.safeConfirmed,
      deathsConfirmed: normalized.safeDeaths
    };
  }

  function renderTrendChart() {
    const lang = t();
    const scope = document.getElementById("trendScope").value;
    const series = trendData(scope);

    if (state.trendChart) state.trendChart.destroy();

    state.trendChart = new Chart(document.getElementById("trendChart"), {
      type: "line",
      data: {
        labels: series.labels,
        datasets: [
          {
            label: lang.trendSeries.confirmed,
            data: series.confirmed,
            borderColor: "#1f4ed8",
            backgroundColor: "rgba(31, 78, 216, 0.14)",
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            borderWidth: 2.4
          },
          {
            label: lang.trendSeries.deaths,
            data: series.deathsConfirmed,
            borderColor: "#d92d20",
            backgroundColor: "rgba(217, 45, 32, 0.1)",
            fill: true,
            tension: 0.25,
            pointRadius: 3,
            pointHoverRadius: 6,
            borderWidth: 2.4,
            borderDash: [6, 4]
          }
        ]
      },
      options: chartOptions()
    });
  }

  function buildContinentScopeOptions() {
    const select = document.getElementById("continentScope");
    const current = select.value || "GLOBAL";

    select.innerHTML = data.continents
      .map((item) => `<option value="${item.code}">${state.lang === "zh" ? item.zh : item.en}</option>`)
      .join("");

    select.value = data.continents.some((item) => item.code === current) ? current : "GLOBAL";
  }

  function metricAt(series, metric, idx) {
    if (metric === "confirmed") return series.confirmed[idx] || 0;
    if (metric === "deaths") return series.deaths[idx] || 0;
    return (series.confirmed[idx] || 0) + (series.probable[idx] || 0);
  }

  function continentSeries(metric) {
    const labels = data.series.dates;
    const buckets = {};

    data.continents
      .filter((item) => item.code !== "GLOBAL")
      .forEach((item) => {
        buckets[item.code] = labels.map(() => 0);
      });

    data.countries.forEach((country) => {
      const key = country.continentCode;
      const series = data.series.byCountry[country.code];
      if (!series || !buckets[key]) return;

      labels.forEach((_, idx) => {
        buckets[key][idx] += metricAt(series, metric, idx);
      });
    });

    return { labels, buckets };
  }

  function renderContinentChart() {
    const metric = document.getElementById("continentMetric").value;
    const scope = document.getElementById("continentScope").value;
    const built = continentSeries(metric);

    const keys = scope === "GLOBAL"
      ? Object.keys(built.buckets)
      : [scope];

    const datasets = keys.map((key) => ({
      label: continentNameByCode(key),
      data: built.buckets[key] || built.labels.map(() => 0),
      borderColor: continentPalette[key] || "#6b7280",
      backgroundColor: "transparent",
      borderWidth: 2.3,
      pointRadius: 3,
      pointHoverRadius: 6,
      tension: 0.2
    }));

    if (state.continentChart) state.continentChart.destroy();

    state.continentChart = new Chart(document.getElementById("continentChart"), {
      type: "line",
      data: {
        labels: built.labels,
        datasets
      },
      options: chartOptions()
    });
  }

  function syncMapHeightToDailyPanel() {
    const dailyPanel = document.querySelector(".daily-panel");
    const mapShell = document.querySelector(".map-shell");
    const mapNode = document.getElementById("map");
    if (!dailyPanel || !mapShell || !mapNode) return;

    const isDesktop = window.matchMedia("(min-width: 1241px)").matches;
    if (!isDesktop) {
      mapShell.style.height = "";
      mapShell.style.minHeight = "";
      mapNode.style.height = "";
      if (state.map) state.map.invalidateSize();
      return;
    }

    const panelHeight = Math.max(560, Math.ceil(dailyPanel.getBoundingClientRect().height));
    mapShell.style.height = `${panelHeight}px`;
    mapShell.style.minHeight = `${panelHeight}px`;

    const shellStyle = window.getComputedStyle(mapShell);
    const shellFrameHeight = ["paddingTop", "paddingBottom", "borderTopWidth", "borderBottomWidth"]
      .reduce((sum, key) => sum + (parseFloat(shellStyle[key]) || 0), 0);
    mapNode.style.height = `${Math.max(260, Math.round(panelHeight - shellFrameHeight))}px`;

    if (state.map) state.map.invalidateSize();
  }

  function scheduleMapHeightSync() {
    syncMapHeightToDailyPanel();
    if (state.layoutSyncRaf) cancelAnimationFrame(state.layoutSyncRaf);
    state.layoutSyncRaf = requestAnimationFrame(() => {
      syncMapHeightToDailyPanel();
      state.layoutSyncRaf = 0;
    });
  }

  function chartOptions() {
    const isNight = state.theme === "night";
    const tick = isNight ? "#9fb1d8" : "#5f6d8f";
    const grid = isNight ? "rgba(159, 177, 216, 0.18)" : "#edf2fb";
    const legend = isNight ? "#d7e3ff" : "#2d3f63";

    return {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: {
            color: legend,
            boxWidth: 14
          }
        },
        tooltip: {
          backgroundColor: isNight ? "#101a2e" : "#1f2937",
          titleColor: "#fff",
          bodyColor: "#e5e7eb"
        }
      },
      scales: {
        x: {
          ticks: { color: tick },
          grid: { color: grid }
        },
        y: {
          beginAtZero: true,
          ticks: { color: tick, precision: 0 },
          grid: { color: grid }
        }
      }
    };
  }

  function renderAll() {
    renderTopText();
    renderDailySummary();
    renderStats();
    renderCountryTable();
    renderTimeline();
    renderNews();
    renderWatchlist();
    renderSources();
    buildTrendScopeOptions();
    buildContinentScopeOptions();
    renderTrendChart();
    renderContinentChart();
    applyMapTheme();
    ensureCountryChoropleth();
    scheduleMapHeightSync();
  }

  function applyLang(lang) {
    state.lang = lang;
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.body.setAttribute("data-lang", lang === "zh" ? "zh" : "en");
    document.getElementById("langZh").classList.toggle("active", lang === "zh");
    document.getElementById("langEn").classList.toggle("active", lang === "en");
    renderAll();
  }

  function toggleTheme() {
    state.theme = state.theme === "day" ? "night" : "day";
    document.body.setAttribute("data-theme", state.theme);
    renderAll();
  }

  function bindEvents() {
    document.getElementById("langZh").addEventListener("click", () => applyLang("zh"));
    document.getElementById("langEn").addEventListener("click", () => applyLang("en"));
    document.getElementById("themeToggle").addEventListener("click", toggleTheme);

    document.getElementById("trendScope").addEventListener("change", renderTrendChart);
    document.getElementById("continentScope").addEventListener("change", renderContinentChart);
    document.getElementById("continentMetric").addEventListener("change", renderContinentChart);
    document.getElementById("newsMoreBtn").addEventListener("click", () => {
      const total = (data.news || []).length;
      if (state.newsLimit < total) {
        state.newsLimit = Math.min(state.newsLimit + state.newsStep, total);
      } else {
        state.newsLimit = state.newsStep;
      }
      renderNews();
    });

    window.addEventListener("resize", scheduleMapHeightSync);

    if (window.ResizeObserver) {
      const dailyPanel = document.querySelector(".daily-panel");
      if (dailyPanel) {
        state.dailyPanelObserver = new ResizeObserver(() => {
          scheduleMapHeightSync();
        });
        state.dailyPanelObserver.observe(dailyPanel);
      }
    }
  }

  function boot() {
    if (!safeDataCheck()) return;
    initMap();
    bindEvents();
    applyLang("zh");
  }

  boot();
</script>
</body>
</html>
